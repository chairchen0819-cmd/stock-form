<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>庫存盤點</title>
<style>
  /* ===== 色彩與字級 token（亮色／暗色）===== */
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1d211c; --muted: #6b7068; --line: #dfe2dc;
    --accent: #06a74f; --accent-ink: #ffffff; --accent-soft: #e3f5ea;
    --warn: #b35c00; --warn-soft: #fff1df; --low: #c62828; --low-soft: #fdeaea;
    --radius: 14px;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141613; --card: #1e211d; --ink: #eceee9; --muted: #9ba097; --line: #31352f;
      --accent: #2bc66d; --accent-ink: #0b1a10; --accent-soft: #183224;
      --warn: #f0a24a; --warn-soft: #34260f; --low: #ff7b72; --low-soft: #3a1c1b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }

  header { padding: 18px 16px 10px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  header .meta { margin-top: 4px; color: var(--muted); font-size: 14px; }
  main { padding: 0 16px 120px; max-width: 560px; margin: 0 auto; }
  .hint { color: var(--muted); font-size: 14px; font-weight: 400; }

  /* 大類收合區塊 */
  details.cat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
  details.cat > summary { list-style: none; cursor: pointer; padding: 14px 14px; display: flex; gap: 10px; align-items: center; }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary::after { content: '▾'; color: var(--muted); margin-left: 4px; transition: transform .15s; }
  details.cat[open] > summary::after { transform: rotate(180deg); }
  details.cat[open] > summary { border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; background: var(--card); border-radius: var(--radius) var(--radius) 0 0; }
  .cname { font-weight: 700; font-size: 18px; }
  .badge { font-size: 13px; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .badge.due { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .badge.opt { background: var(--bg); color: var(--muted); }
  .csum { margin-left: auto; text-align: right; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .csum b { color: var(--ink); font-size: 15px; }
  .cbody { padding: 10px 10px 4px; }
  .optin { display: flex; align-items: center; gap: 10px; padding: 10px 6px 12px; font-weight: 600; }
  .optin input { width: 22px; height: 22px; accent-color: var(--accent); }
  .cbody.off .grp { opacity: .45; }

  .grp { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: var(--card); }
  .grp-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 9px 12px;
              background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
  .grp-head .gname { font-weight: 700; }
  .grp-head .gsub { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; font-size: 15px; }
  .grp-flag:empty { display: none; }
  .grp-flag { padding: 0 12px 8px; background: color-mix(in srgb, var(--accent) 7%, var(--card)); }

  .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
  .row .lab { flex: 1; min-width: 0; }
  .row .lab .bn { font-weight: 600; }
  .row .lab .sub { font-size: 13px; color: var(--muted); }
  .row .lab .sub.chg { color: var(--warn); font-weight: 600; }
  .row.edited { box-shadow: inset 4px 0 0 var(--warn); }
  .qty { width: 46%; max-width: 190px; display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px;
         background: var(--bg); padding: 0 10px; min-height: 46px; }
  .qty:focus-within { border-color: var(--accent); }
  .qty input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; font-size: 19px; text-align: right;
               font-variant-numeric: tabular-nums; outline: none; padding: 8px 0; }
  .qty .unit { color: var(--muted); font-size: 14px; margin-left: 6px; }
  .qty input:disabled { color: var(--muted); }
  .rowflags { padding: 0 12px 8px; margin-top: -4px; }
  .rowflags:empty { display: none; }
  details.zero > summary { list-style: none; cursor: pointer; padding: 9px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  details.zero > summary::-webkit-details-marker { display: none; }
  .flag { margin: 2px 4px 2px 0; font-size: 13px; border-radius: 8px; padding: 3px 8px; display: inline-block; }
  .flag.low { color: var(--low); background: var(--low-soft); }
  .flag.big { color: var(--warn); background: var(--warn-soft); }

  .extra { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-top: 12px; }
  .extra > label, .extra .lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  .extra textarea { width: 100%; min-height: 72px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px 10px; resize: vertical; }
  .extra .photo-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--bg); }
  .photo-prev { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .photo-prev img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  .link { background: none; border: 0; color: var(--low); padding: 6px; text-decoration: underline; }

  /* 日期列（機台生效日、到貨日） */
  .datebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .datebar input[type=date] { min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 10px; font-size: 17px; }
  .chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* 機台列 */
  .mrow .qty { width: auto; flex: 1; max-width: none; }
  .mrow .qty input { text-align: center; }
  .step { min-width: 52px; min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); font-size: 22px; font-weight: 700; }
  .mrow { flex-wrap: wrap; }
  .mrow .lab { flex-basis: 100%; }
  .step.swap { font-size: 16px; font-weight: 600; color: var(--accent); }
  .step:disabled { opacity: .35; }
  .mempty { padding: 12px; color: var(--muted); font-size: 14px; }
  .addbtn { display: block; width: 100%; min-height: 46px; border: 0; border-top: 1px dashed var(--line); background: var(--card); color: var(--accent); font-weight: 600; text-align: left; padding: 0 12px; }
  /* 規格挑選視窗（換規格／加開） */
  .pickq { width: 100%; min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; font-size: 17px; margin: 4px 0 8px; }
  .picklist { max-height: 50vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
  .pickitem { display: flex; justify-content: space-between; gap: 8px; width: 100%; min-height: 46px; border: 0; border-bottom: 1px solid var(--line); background: var(--card); padding: 0 12px; text-align: left; align-items: center; }
  .pickitem:last-child { border-bottom: 0; }
  .pickitem .sub { color: var(--muted); font-size: 13px; white-space: nowrap; }

  /* 申報表單 */
  .extra select.pickq { appearance: auto; }
  .rrow { padding: 8px 0; border-top: 0; }
  .rrow select { flex: 1; min-width: 0; min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 8px; font-size: 16px; }
  .rrow .qty { width: 104px; flex: none; }
  .rrow .step { min-width: 44px; font-size: 18px; }
  .apsum { margin-top: 6px; font-weight: 600; }
  .apsum.ok { color: var(--accent); }
  .apsum.bad { color: var(--warn); }
  .apwarn { margin-top: 6px; color: var(--low); font-size: 14px; }
  .apwarn:empty { display: none; }
  .mine li { margin-bottom: 4px; }
  .mine .st { font-size: 13px; border-radius: 999px; padding: 1px 8px; margin-left: 4px; background: var(--bg); color: var(--muted); }
  .mine .st.ok { background: var(--accent-soft); color: var(--accent); }
  .mine .st.no { background: var(--low-soft); color: var(--low); }
  .mine li.voided .rl { text-decoration: line-through; color: var(--muted); }
  .mine .rl { font-size: 14px; }
  .dlg .vreason { width: 100%; min-height: 44px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px 10px; }
  .applink { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; text-decoration: underline; }

  /* 抽紗機數據 */
  .ytabs { display: flex; gap: 8px; margin: 0 0 12px; }
  .ytabs .chip { flex: 1; min-height: 46px; font-size: 17px; }
  .ygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 10px 12px; }
  .yf { display: block; min-width: 0; }
  .yf .yl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .yf .qty { width: 100%; max-width: none; min-height: 44px; }
  .yf .qty input { font-size: 18px; }
  .yf.warn .qty { border-color: var(--warn); background: var(--warn-soft); }
  .yf.bad .qty { border-color: var(--low); background: var(--low-soft); }
  .yf .yw { display: block; font-size: 12px; color: var(--warn); min-height: 0; }
  .yf.bad .yw { color: var(--low); }
  .ysec { padding: 8px 12px 0; font-weight: 700; border-top: 1px solid var(--line); }
  .ysec:first-child { border-top: 0; }
  .ysts { display: flex; gap: 8px; padding: 10px 12px; }
  .ysts .chip { flex: 1; }
  .ysel { width: 100%; min-height: 44px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 8px; font-size: 16px; }
  .ysame { margin: 0 12px 4px; }
  .badge.done { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .badge.todo { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .vlinks { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .vlinks .chip { flex: 1 1 auto; }
  .vsec { margin: 0 0 14px; }
  .vsec > summary { font-size: 17px; }
  .yf.spot .qty { border-style: dashed; border-color: var(--accent); }
  .yspot { margin: 8px 12px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card);
         border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .bar .prog { font-size: 14px; color: var(--muted); flex: 1; }
  .bar .prog b { color: var(--ink); font-size: 17px; }
  .btn { min-height: 48px; border-radius: 12px; padding: 0 18px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; }

  .center { text-align: center; padding: 48px 16px; }
  .center .big { font-size: 48px; }
  .center p { color: var(--muted); }
  .err { color: var(--low); white-space: pre-line; }

  dialog { border: 0; border-radius: 18px; padding: 0; width: min(92vw, 480px); max-height: 88vh; overflow-y: auto; background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 18px 16px 14px; }
  .dlg h3 { margin: 0 0 8px; font-size: 19px; }
  .dlg ul { margin: 6px 0 10px; padding-left: 20px; }
  .dlg .sec { font-size: 15px; font-weight: 600; margin-top: 12px; }
  .dlg .acts { display: flex; gap: 10px; margin-top: 14px; }
  .dlg .acts .btn { flex: 1; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
  .tbl td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .tbl td.n { text-align: right; white-space: nowrap; padding-left: 8px; }
  .tbl tr.c td { font-weight: 700; padding-top: 8px; }
  .tbl tr.g td:first-child { padding-left: 12px; }
  .tbl .lowt { color: var(--low); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; margin: 0 auto 12px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } details.cat > summary::after { transition: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">庫存盤點</h1>
  <div class="meta" id="meta">載入中…</div>
</header>
<main id="app"><div class="center"><div class="spin"></div><p>載入中…</p></div></main>
<dialog id="confirm"><div class="dlg" id="confirmBody"></div></dialog>
<dialog id="pick"><div class="dlg" id="pickBody"></div></dialog>

<script>
/* ===== 部署設定：換成實際值（皆非機密，可公開）===== */
var CONFIG = {
  LIFF_ID: '2012304943-QoezM7Xb',                                 // LINE Developers → LIFF 分頁的 LIFF ID
  GAS_URL: 'https://script.google.com/macros/s/AKfycbznj_abRcL1Ry8KOghvHlgBGJbYgELaHktNfTChf7xLYj1AwWhAwBX2cYpMNpLPCTZdYQ/exec',    // Apps Script 部署後的網頁應用程式網址
  FORCE_DEMO: false                                                // true＝不連 LINE／後端，只看畫面
};

/* 網址參數：LIFF 會先把參數放在 liff.state，初始化後才還原，兩處都看 */
function param(name) {
  var q = location.search, m = /[?&]liff\.state=([^&]*)/.exec(q);
  var all = q + (m ? '&' + decodeURIComponent(m[1]).replace(/^\?/, '') : '');
  var r = new RegExp('[?&]' + name + '=([^&]*)').exec(all);
  return r ? decodeURIComponent(r[1]) : null;
}
var DEMO = CONFIG.FORCE_DEMO || param('demo') === '1';
var FORM = ['machine', 'receive', 'apply', 'yarn', 'yarnstock', 'view', 'denier'].indexOf(param('form')) >= 0 ? param('form') : 'stock';
var TITLES = { stock: '庫存盤點', receive: '進貨登錄', machine: '機台開機狀況', apply: '申報新規格／新廠牌', yarn: '抽紗機數據', yarnstock: '庫存紗盤點', view: '查詢', denier: '丹尼回報' };
document.title = TITLES[FORM];
document.getElementById('title').textContent = TITLES[FORM];

var state = { data: null, qty: {}, note: '', photo: null, submitId: null, busy: false, optIn: {} };
var app = document.getElementById('app');
var DRAFT_KEY = 'stock-draft-v2';

/* ---------- 工具 ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return (n == null || n === '') ? '—' : Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 }); }
function newId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
/* 輸入字串 → 數字；空白或非數字回傳 null（不做捨入，原樣送出） */
function parseQty(s) {
  s = String(s == null ? '' : s).replace(/,/g, '').trim();
  if (s === '' || !/^\d+(\.\d+)?$/.test(s)) return null;
  return Number(s);
}
function dec(n) { var s = String(n); return s.indexOf('.') < 0 ? 0 : s.length - s.indexOf('.') - 1; }
/* 加總、相乘時避免浮點尾差（0.1+0.2），不做捨入；與後端 addQty_／mulQty_ 同規則 */
function addQty(a, b) { var f = Math.pow(10, Math.max(dec(a), dec(b))); return (Math.round(a * f) + Math.round(b * f)) / f; }
function mulQty(a, b) { var da = dec(a), db = dec(b); return (Math.round(a * Math.pow(10, da)) * Math.round(b * Math.pow(10, db))) / Math.pow(10, da + db); }
function md(s) { return s ? s.slice(5, 16).replace('-', '/') : ''; }
function addDays(key, n) { var d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function byCode(code) { return state.data.items.filter(function (x) { return x.code === code; })[0]; }
function catOf(name) { return (state.data.categories || []).filter(function (c) { return c.category === name; })[0]; }
function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ qty: state.qty, optIn: state.optIn, note: state.note, submitId: state.submitId, t: Date.now() })); } catch (e) {} }
function loadDraft() { try { var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (d && Date.now() - d.t < 12 * 3600 * 1000) return d; } catch (e) {} return null; }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
/* 換到另一張表單（同一個 LIFF 頁面，換網址參數重新載入；示範模式保留 demo=1） */
function gotoForm(form, extra) {
  var q = ['form=' + form];
  if (DEMO) q.push('demo=1');
  Object.keys(extra || {}).forEach(function (k) { if (extra[k]) q.push(k + '=' + encodeURIComponent(extra[k])); });
  location.href = location.pathname + '?' + q.join('&');
}

/* ---------- 後端呼叫 ---------- */
function call(action, extra) {
  if (DEMO) return demoCall(action, extra || {});
  var body = Object.assign({ action: action, idToken: liff.getIDToken() }, extra || {});
  // Content-Type 用 text/plain，避免瀏覽器先送預檢請求（Apps Script 不處理 OPTIONS）
  return fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
    .then(function (r) { if (!r.ok) throw new Error('伺服器回應 ' + r.status); return r.json(); })
    .then(function (res) {
      if (res.ok) return res;
      if (res.code === 'AUTH') { if (FORM === 'stock') saveDraft(); liff.login({ redirectUri: location.href }); }
      var e = new Error(res.message || '發生錯誤'); e.code = res.code; throw e;
    });
}

/* ---------- 啟動 ---------- */
function start() {
  var p = DEMO ? Promise.resolve() : liff.init({ liffId: CONFIG.LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(function () {}); }
  });
  p.then(function () { return call('init', { form: FORM }); })
   .then(function (res) {
     if (res.status === 'pending') return renderPending(res);
     state.data = res; state.submitId = newId();
     if (FORM === 'machine') return renderMachine();
     if (FORM === 'receive') return renderReceive();
     if (FORM === 'apply') return renderApply();
     if (FORM === 'yarn') return renderYarn();
     if (FORM === 'yarnstock') return renderYarnStock();
     if (FORM === 'view') return renderView();
     if (FORM === 'denier') return renderDenier();
     renderStock();
   })
   .catch(function (e) { renderError(e.message || String(e)); });
}
function renderPending(res) {
  document.getElementById('meta').textContent = res.name || '';
  app.innerHTML = '<div class="center"><div class="big">🕒</div><h2>已送出開通申請</h2><p>' + esc(res.name) +
    '，管理者開通後就能使用。<br>請告知管理者您已完成申請。</p></div>';
}
function renderError(msg) {
  app.innerHTML = '<div class="center"><div class="big">⚠️</div><h2>無法載入</h2><p class="err">' + esc(msg) +
    '</p><button class="btn" onclick="location.reload()">重新載入</button></div>';
}
function mountBar(html) {
  var bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<div class="in">' + html + '</div>';
  document.body.appendChild(bar);
}
function showDialog(html, onGo) {
  document.getElementById('confirmBody').innerHTML = html +
    '<div class="acts"><button class="btn" id="back" type="button">返回修改</button><button class="btn primary" id="go" type="button">確認送出</button></div>';
  var dlg = document.getElementById('confirm'); dlg.showModal();
  document.getElementById('back').onclick = function () { dlg.close(); };
  document.getElementById('go').onclick = function () { dlg.close(); onGo(); };
}
function renderDoneShell(title, inner) {
  var bar = document.querySelector('.bar'); if (bar) bar.remove();
  app.innerHTML = '<div class="center"><div class="big">✅</div><h2>' + title + '</h2>' + inner +
    '<button class="btn primary" id="closeBtn" type="button">關閉</button></div>';
  window.scrollTo(0, 0);
  document.getElementById('closeBtn').onclick = function () { if (!DEMO && liff.isInClient()) liff.closeWindow(); else location.reload(); };
}
function failSubmit(e, btn, refresh) {
  state.busy = false; btn.textContent = '送出'; refresh();
  if (e.code !== 'AUTH') alert('送出失敗：' + (e.message || e) + '\n\n填好的內容都還在，可以直接再按一次送出。');
}
/* 一次只展開一個大類 */
function accordion(root) {
  root.querySelectorAll('details.cat').forEach(function (d) {
    d.addEventListener('toggle', function () {
      if (d.open) root.querySelectorAll('details.cat[open]').forEach(function (o) { if (o !== d) o.open = false; });
    });
  });
}
/* 依「大類 → 品項」分組（保留後端排序） */
function grouped(items) {
  var cats = [], ci = {};
  items.forEach(function (it) {
    if (!(it.category in ci)) { ci[it.category] = cats.length; cats.push({ category: it.category, groups: [], gi: {} }); }
    var c = cats[ci[it.category]];
    if (!(it.group in c.gi)) { c.gi[it.group] = c.groups.length; c.groups.push({ group: it.group, unit: it.unit, items: [] }); }
    c.groups[c.gi[it.group]].items.push(it);
  });
  return cats;
}

/* ================================================================
   一、庫存盤點
   ================================================================ */
/* 這個大類這次有沒有盤：到期的一定盤；沒到期的要勾選「這次也盤」 */
function isCounted(cat) { var c = catOf(cat); return (c && c.due) || !!state.optIn[cat]; }
function countedItems() { return state.data.items.filter(function (it) { return isCounted(it.category); }); }
function isLow(it, q) { return q != null && it.safety > 0 && q < it.safety; }
function isBig(it, q) { return q != null && it.lastQty != null && it.lastQty > 0 && Math.abs(q - it.lastQty) / it.lastQty > state.data.bigChangeRatio; }

/* 小計與總計（與後端 computeTotals_ 同規則；只算有盤的大類） */
function computeTotals(items) {
  var cats = [], ci = {}, lowBrands = [];
  items.forEach(function (it) {
    var q = state.qty[it.code], has = q != null;
    if (!(it.category in ci)) { ci[it.category] = cats.length; cats.push({ category: it.category, unit: it.unit, total: 0, complete: true, groups: [], _g: {} }); }
    var c = cats[ci[it.category]];
    if (!(it.group in c._g)) { c._g[it.group] = c.groups.length; c.groups.push({ group: it.group, unit: it.unit, subtotal: 0, safety: it.groupSafety || 0, low: false, complete: true, unchanged: true }); }
    var g = c.groups[c._g[it.group]];
    g.subtotal = addQty(g.subtotal, has ? q : 0); c.total = addQty(c.total, has ? q : 0);
    if (!has) { g.complete = false; c.complete = false; }
    if (q !== it.lastQty) g.unchanged = false;
    if (c.unit !== it.unit) c.unit = '';
    if (isLow(it, q)) lowBrands.push({ name: it.name, qty: q, unit: it.unit, safety: it.safety });
  });
  var lowGroups = [];
  cats.forEach(function (c) { delete c._g; c.groups.forEach(function (g) {
    g.low = g.complete && g.safety > 0 && g.subtotal < g.safety;
    if (g.low) lowGroups.push({ name: g.group, qty: g.subtotal, unit: g.unit, safety: g.safety });
  }); });
  return { categories: cats, lowGroups: lowGroups, lowBrands: lowBrands };
}

function renderStock() {
  var d = state.data, draft = loadDraft();
  state.qty = {}; state.optIn = {};
  d.items.forEach(function (it) { if (it.lastQty != null) state.qty[it.code] = it.lastQty; }); // 預填上次數量
  if (draft) {
    state.optIn = draft.optIn || {}; state.note = draft.note || ''; state.submitId = draft.submitId || state.submitId;
    d.items.forEach(function (it) { if (draft.qty && it.code in draft.qty) state.qty[it.code] = draft.qty[it.code]; });
  }
  var dueNames = d.categories.filter(function (c) { return c.due; }).map(function (c) { return c.category; });
  document.getElementById('meta').textContent = d.warehouse + '・' + d.name + '・本次要盤：' + (dueNames.join('、') || '無（可自選）');
  var html = '<p class="hint" style="margin:0 0 10px">數量已預填上次盤點值，<b>只改有變動的</b>；沒有變動的不用動。</p>';
  // 到期的大類排前面
  var cats = grouped(d.items).sort(function (a, b) { return (catOf(b.category).due ? 1 : 0) - (catOf(a.category).due ? 1 : 0); });
  var firstDue = true;
  cats.forEach(function (c, ci) {
    var st = catOf(c.category);
    html += '<details class="cat" data-cat="' + esc(c.category) + '"' + (st.due && firstDue ? ' open' : '') + '><summary>' +
      '<span class="cname">' + esc(c.category) + '</span>' +
      (st.due ? '<span class="badge due">本次要盤</span>' : '<span class="badge opt">可選' + (st.lastTime ? '・上次 ' + md(st.lastTime).slice(0, 5) : '') + '</span>') +
      '<span class="csum" id="cs' + ci + '"></span></summary><div class="cbody" id="cb' + ci + '">';
    if (st.due) firstDue = false;
    else html += '<label class="optin"><input type="checkbox" data-optin="' + esc(c.category) + '"' + (state.optIn[c.category] ? ' checked' : '') + '>這次也盤這一類（每 ' + st.cycle + ' 天盤一次）</label>';
    c.groups.forEach(function (g, gi) {
      var gid = ci + '-' + gi;
      html += '<div class="grp"><div class="grp-head"><span class="gname">' + esc(g.group) + '</span><span class="gsub" id="gs' + gid + '"></span></div><div class="grp-flag" id="gf' + gid + '"></div>';
      var zero = g.items.filter(function (it) { return it.lastQty === 0; });
      g.items.filter(function (it) { return it.lastQty !== 0; }).forEach(function (it) { html += stockRow(it); });
      if (zero.length) html += '<details class="zero"><summary>上次為 0 的廠牌（' + zero.length + '）▾</summary>' + zero.map(stockRow).join('') + '</details>';
      html += '</div>';
    });
    html += '</div></details>';
    c.ci = ci;
  });
  state.cats = cats;
  html += '<div class="extra"><span class="lbl">照片 <span class="hint">（選填，異常時拍一張）</span></span>' +
    '<label class="photo-btn">📷 拍照／選照片<input type="file" accept="image/*" id="photo" hidden></label><div class="photo-prev" id="photoPrev"></div></div>' +
    '<div class="extra"><label for="note">備註 <span class="hint">（選填）</span></label><textarea id="note" maxlength="500" placeholder="例如：HDPE 廠牌C 有兩包受潮"></textarea></div>';
  app.innerHTML = html;
  document.getElementById('note').value = state.note;
  accordion(app);

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('input[data-code]')) {
      var q = parseQty(t.value);
      if (q == null) delete state.qty[t.dataset.code]; else state.qty[t.dataset.code] = q;
      refreshStock(); saveDraft();
    } else if (t.id === 'note') { state.note = t.value; saveDraft(); }
  });
  app.addEventListener('change', function (e) {
    if (e.target.matches('input[data-optin]')) { state.optIn[e.target.dataset.optin] = e.target.checked; refreshStock(); saveDraft(); }
  });
  app.addEventListener('click', function (e) {
    if (e.target.id === 'rmPhoto') { state.photo = null; document.getElementById('photoPrev').innerHTML = ''; document.getElementById('photo').value = ''; }
  });
  document.getElementById('photo').addEventListener('change', onPhoto);
  mountBar('<div class="prog" id="prog"></div><button class="btn primary" id="submit" type="button">送出</button>');
  document.getElementById('submit').onclick = openStockConfirm;
  refreshStock();
}

function stockRow(it) {
  var v = state.qty[it.code];
  return '<div class="row" id="r-' + esc(it.code) + '"><div class="lab"><div class="bn">' + esc(it.brand || it.group) + '</div>' +
    '<div class="sub" id="sub-' + esc(it.code) + '"></div></div>' +
    '<label class="qty"><input inputmode="decimal" autocomplete="off" aria-label="' + esc(it.name) + ' 數量" data-code="' + esc(it.code) + '"' +
    ' value="' + (v == null ? '' : v) + '" placeholder="輸入"><span class="unit">' + esc(it.unit) + '</span></label></div>' +
    '<div class="rowflags" id="rf-' + esc(it.code) + '"></div>';
}

/* 依目前輸入更新：每列的變動提示、品項小計、大類總計與進度、送出鈕 */
function refreshStock() {
  var d = state.data, needFill = 0, edited = 0, countedCats = 0;
  d.items.forEach(function (it) {
    var on = isCounted(it.category), q = state.qty[it.code];
    var inp = app.querySelector('input[data-code="' + it.code + '"]'); inp.disabled = !on;
    var changed = q !== it.lastQty;
    document.getElementById('r-' + it.code).classList.toggle('edited', on && changed && q != null);
    var sub = document.getElementById('sub-' + it.code);
    sub.className = 'sub' + (changed && q != null && it.lastQty != null ? ' chg' : '');
    sub.textContent = it.lastQty == null ? '新廠牌，請填數量' : changed && q != null
      ? '上次 ' + fmt(it.lastQty) + ' → ' + (q - it.lastQty > 0 ? '+' : '') + fmt(addQty(q, -it.lastQty)) : '上次 ' + fmt(it.lastQty);
    var f = '';
    if (on && isLow(it, q)) f += '<span class="flag low">此廠牌低於安全庫存 ' + fmt(it.safety) + '</span>';
    if (on && isBig(it, q)) f += '<span class="flag big">和上次差很多，請確認</span>';
    document.getElementById('rf-' + it.code).innerHTML = f;
    if (on) { if (q == null) needFill++; if (changed && q != null) edited++; }
  });
  var t = computeTotals(d.items);
  t.categories.forEach(function (c) {
    var meta = state.cats.filter(function (x) { return x.category === c.category; })[0], ci = meta.ci, on = isCounted(c.category);
    var catEdited = d.items.filter(function (it) { return it.category === c.category && state.qty[it.code] !== it.lastQty && state.qty[it.code] != null; }).length;
    if (on) countedCats++;
    document.getElementById('cb' + ci).classList.toggle('off', !on);
    document.getElementById('cs' + ci).innerHTML = on
      ? '總計 <b>' + fmt(c.total) + '</b> ' + esc(c.unit) + '<br>' + (c.complete ? '改了 ' + catEdited + ' 項' : '<span style="color:var(--low)">有未填</span>')
      : '這次不盤';
    c.groups.forEach(function (g, gi) {
      var gid = ci + '-' + gi;
      document.getElementById('gs' + gid).textContent = '小計 ' + fmt(g.subtotal) + ' ' + g.unit + (g.complete ? '' : '（未填完）');
      document.getElementById('gf' + gid).innerHTML = on && g.low ? '<span class="flag low">品項小計低於安全庫存 ' + fmt(g.safety) + '</span>' : '';
    });
  });
  document.getElementById('prog').innerHTML = '本次盤 <b>' + countedCats + '</b> 類・改了 <b>' + edited + '</b> 項' + (needFill ? '・<span style="color:var(--low)">未填 ' + needFill + '</span>' : '');
  document.getElementById('submit').disabled = needFill > 0 || countedCats === 0 || state.busy;
}

/* 照片：縮到長邊 1280px、JPEG 品質 0.75，降低上傳量 */
function shrinkPhoto(file, done) {
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function () {
    var s = Math.min(1, 1280 / Math.max(img.width, img.height));
    var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); done(c.toDataURL('image/jpeg', 0.75));
  };
  img.onerror = function () { alert('這張照片讀不到，請換一張'); };
  img.src = url;
}
function onPhoto(e) {
  var file = e.target.files && e.target.files[0]; if (!file) return;
  shrinkPhoto(file, function (data) {
    state.photo = data;
    document.getElementById('photoPrev').innerHTML = '<img alt="已選照片" src="' + state.photo + '"><button class="link" id="rmPhoto" type="button">移除</button>';
  });
}

function totalsTable(t) {
  return '<table class="tbl">' + t.categories.map(function (c) {
    return '<tr class="c"><td>' + esc(c.category) + ' 總計</td><td class="n">' + fmt(c.total) + ' ' + esc(c.unit) + '</td></tr>' +
      c.groups.map(function (g) { return '<tr class="g' + (g.low ? ' lowt' : '') + '"><td>' + esc(g.group) + (g.low ? ' ⚠' : '') + '</td><td class="n">' + fmt(g.subtotal) + '</td></tr>'; }).join('');
  }).join('') + '</table>';
}
function lowList(t) {
  var li = function (x, tag) { return '<li>' + tag + esc(x.name) + '：<b>' + fmt(x.qty) + '</b> ' + esc(x.unit) + '（安全 ' + fmt(x.safety) + '）</li>'; };
  return t.lowGroups.map(function (x) { return li(x, '[品項小計] '); }).join('') + t.lowBrands.map(function (x) { return li(x, '[廠牌] '); }).join('');
}

/*
 * 送出前確認。「沒改數字但系統估計應該有變」：品項的廠牌全部維持上次數字，
 * 而理論庫存和上次盤點差了 2% 以上（且至少 1）時提醒，防止沒點就送出。
 */
function openStockConfirm() {
  var items = countedItems(), t = computeTotals(items), big = [], lazy = [];
  items.forEach(function (it) { if (isBig(it, state.qty[it.code])) big.push(it); });
  t.categories.forEach(function (c) { c.groups.forEach(function (g) {
    var L = state.data.ledger[c.category + '|' + g.group];
    if (g.unchanged && L && L.base > 0 && Math.abs(L.theo - L.base) >= Math.max(1, L.base * 0.02)) lazy.push({ g: g, L: L });
  }); });
  var edited = items.filter(function (it) { return state.qty[it.code] !== it.lastQty; }).length;
  var h = '<h3>確認送出？</h3><div>本次盤 ' + t.categories.map(function (c) { return esc(c.category); }).join('、') + '，共 ' + items.length + ' 項：改了 <b>' + edited + '</b> 項</div>';
  if (lazy.length) h += '<div class="sec" style="color:var(--warn)">數字都沒改，但系統估計應該有變動</div><ul>' + lazy.map(function (x) {
    return '<li>' + esc(x.g.group) + '：維持 ' + fmt(x.L.base) + '，系統估計約 <b>' + fmt(Math.max(0, x.L.theo)) + '</b>（' + (x.L.theo < x.L.base ? '應已用掉約 ' + fmt(x.L.base - x.L.theo) : '期間有進貨') + '）</li>'; }).join('') + '</ul><div class="hint">確定有實際點過再送出。</div>';
  if (big.length) h += '<div class="sec" style="color:var(--warn)">和上次差很多（請再看一眼）</div><ul>' + big.map(function (it) {
    return '<li>' + esc(it.name) + '：<b>' + fmt(state.qty[it.code]) + '</b>（上次 ' + fmt(it.lastQty) + '）</li>'; }).join('') + '</ul>';
  if (t.lowGroups.length || t.lowBrands.length) h += '<div class="sec" style="color:var(--low)">低於安全庫存（會通知管理者）</div><ul>' + lowList(t) + '</ul>';
  h += '<div class="sec">本次總計與小計</div>' + totalsTable(t);
  showDialog(h, submitStock);
}

function submitStock() {
  state.busy = true; refreshStock();
  var btn = document.getElementById('submit'); btn.textContent = '送出中…';
  var entries = countedItems().map(function (it) { return { code: it.code, qty: state.qty[it.code] }; });
  call('submit', { submitId: state.submitId, entries: entries, note: state.note, photo: state.photo })
    .then(function (res) {
      clearDraft();
      var h = '<p>共 ' + res.count + ' 項・批號 ' + esc(res.batchId) + '</p>';
      if (res.lowCount) h += '<p style="color:var(--low)">低於安全庫存 ' + res.lowCount + ' 項，已通知管理者。</p>';
      if (res.variance && res.variance.length) h += '<div style="text-align:left;max-width:420px;margin:0 auto 8px"><div class="sec" style="font-weight:600">盤點差異（實盤－理論）</div><table class="tbl">' +
        res.variance.map(function (v) { var bad = v.ratio !== null && Math.abs(v.ratio) > 0.05;
          return '<tr class="g' + (bad ? ' lowt' : '') + '"><td>' + esc(v.group) + (bad ? ' ⚠' : '') + '</td><td class="n">' + (v.diff > 0 ? '+' : '') + fmt(v.diff) +
            (v.ratio === null ? '' : '（' + (v.ratio > 0 ? '+' : '') + fmt(v.ratio * 100) + '%）') + '</td></tr>'; }).join('') + '</table></div>';
      h += '<div style="text-align:left;max-width:420px;margin:0 auto 16px">' + totalsTable(res.totals) + '</div>';
      renderDoneShell('已送出，謝謝！', h);
    })
    .catch(function (e) { failSubmit(e, btn, refreshStock); });
}

/* ================================================================
   二、進貨登錄
   ================================================================ */
function dateBar(id, label) {
  var d = state.data;
  return '<div class="extra" style="margin:0 0 12px"><span class="lbl">' + label + '</span><div class="datebar">' +
    '<input type="date" id="' + id + '" value="' + d.today + '" min="' + d.minDate + '" max="' + d.today + '">' +
    '<button type="button" class="chip" data-day="0">今天</button><button type="button" class="chip" data-day="-1">昨天</button></div></div>';
}
/* 日期快捷鈕：今天／昨天，並同步按鈕狀態 */
function wireDate(id, onChange) {
  var inp = document.getElementById(id), d = state.data;
  var sync = function () {
    app.querySelectorAll('[data-day]').forEach(function (b) { b.setAttribute('aria-pressed', String(inp.value === addDays(d.today, Number(b.dataset.day)))); });
    onChange();
  };
  app.querySelectorAll('[data-day]').forEach(function (b) { b.onclick = function () { inp.value = addDays(d.today, Number(b.dataset.day)); sync(); }; });
  inp.addEventListener('change', sync); sync();
}
function validDate(v) { var d = state.data; return /^\d{4}-\d{2}-\d{2}$/.test(v) && v >= d.minDate && v <= d.today; }

function renderReceive() {
  var d = state.data;
  state.qty = {};
  document.getElementById('meta').textContent = d.warehouse + '・' + d.name + '・收貨當下登錄，只填有到貨的品項';
  var html = dateBar('rdate', '到貨日');
  grouped(d.items).forEach(function (c, ci) {
    html += '<details class="cat"' + (ci === 0 ? ' open' : '') + '><summary><span class="cname">' + esc(c.category) + '</span><span class="csum" id="rs' + ci + '"></span></summary><div class="cbody">';
    c.groups.forEach(function (g) {
      html += '<div class="grp"><div class="grp-head"><span class="gname">' + esc(g.group) + '</span></div>' + g.items.map(function (it) {
        return '<div class="row"><div class="lab"><div class="bn">' + esc(it.brand || it.group) + '</div></div><label class="qty"><input inputmode="decimal" autocomplete="off" aria-label="' + esc(it.name) +
          ' 到貨數量" data-rcode="' + esc(it.code) + '" placeholder="到貨"><span class="unit">' + esc(it.unit) + '</span></label></div>';
      }).join('') + '</div>';
    });
    html += '</div></details>';
    c.items = c.groups.reduce(function (a, g) { return a.concat(g.items); }, []);
  });
  state.rcats = grouped(d.items);
  html += '<div class="extra"><label for="note">備註 <span class="hint">（選填，例如供應商、單號）</span></label><textarea id="note" maxlength="500"></textarea></div>';
  html += '<p class="hint" style="margin:12px 2px">清單裡沒有這家廠牌？<button type="button" class="applink" id="toApply">申報新廠牌</button></p>';

    gotoForm('apply', { kind: 'brand' });
  };
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('input[data-rcode]')) { var q = parseQty(t.value); if (q == null || q === 0) delete state.qty[t.dataset.rcode]; else state.qty[t.dataset.rcode] = q; refreshReceive(); }

/* 我最近登錄的進貨（本人 N 天內）：打錯可整筆作廢，再重新登錄正確的；已盤點過的不能作廢（盤點已校正） */
function recentReceiptsHtml() {
  var r = state.data.recent || [];
  if (!r.length) return '';
  return '<div class="extra" id="recent"><span class="lbl">我最近 ' + (state.data.voidDays || 7) + ' 天登錄的進貨 <span class="hint">打錯了：作廢後重新登錄</span></span>' +
    '<ul class="mine" style="margin:0;padding-left:20px">' + r.map(function (b, i) {
      return '<li' + (b.voided ? ' class="voided"' : '') + '><b>到貨 ' + esc(b.date.slice(5).replace('-', '/')) + '</b> <span class="hint">登錄 ' + esc(md(b.time)) + '</span>' +
        (b.voided ? '<span class="st no">已作廢</span>' : '') +
        '<div class="rl">' + b.lines.map(function (l) { return esc(l.name) + ' ' + fmt(l.qty) + ' ' + esc(l.unit); }).join('、') + '</div>' +
        (b.voidable ? '<button type="button" class="applink" data-void="' + i + '">作廢這筆</button>'
                    : (!b.voided && b.blockReason ? '<div class="hint">' + esc(b.blockReason) + '</div>' : '')) + '</li>';
    }).join('') + '</ul></div>';
}

/* ================================================================
   三、機台開機
   ================================================================ */
/* 每日用料試算：Σ（台數 × 每台每日用料 × 比例%），與後端 rateOn_ 同規則 */
function computeUsage() {
  var d = state.data, by = {}, order = [];
  d.specs.forEach(function (sp) {
    var n = state.counts[sp.code] || 0; if (!n) return;
    (d.recipes[sp.name] || []).forEach(function (x) {
      var k = x.category + '|' + x.group;
      if (!(k in by)) { by[k] = 0; order.push(x); }
      by[k] = addQty(by[k], mulQty(mulQty(n, sp.perDay), x.ratio) / 100);
    });
  });
  return order.map(function (x) { return { category: x.category, group: x.group, perDay: by[x.category + '|' + x.group] }; });
}
function typeTotal(type) { return state.data.specs.filter(function (sp) { return sp.type === type; }).reduce(function (a, sp) { return a + (state.counts[sp.code] || 0); }, 0); }
function usageRows(u) { return u.length ? u.map(function (x) { return '<tr><td>' + esc(x.group) + '</td><td class="n">' + fmt(x.perDay) + ' kg</td></tr>'; }).join('') : '<tr><td>目前沒有開機中的規格</td><td></td></tr>'; }

function specByCode(code) { return state.data.specs.filter(function (sp) { return sp.code === code; })[0]; }
/* 一個機型底下目前要顯示的規格：開表單時有開機的，加上這次「換」或「加開」進來的（減到 0 也留著，方便看出變動） */
function machineRowsHtml(t) {
  var list = state.data.specs.filter(function (sp) { return sp.type === t && state.shown[sp.code]; });
  if (!list.length) return '<div class="mempty">目前沒有開機中的規格</div>';
  return list.map(function (sp) {
    var n = state.counts[sp.code];
    return '<div class="row mrow" id="sp-' + esc(sp.code) + '"><div class="lab"><span class="bn">' + esc(sp.name) + '</span>　<span class="sub" style="display:inline">每台每日 ' + fmt(sp.perDay) + ' kg</span></div>' +
      '<button type="button" class="step" data-step="-1" data-code="' + esc(sp.code) + '" aria-label="減一台">－</button>' +
      '<label class="qty"><input inputmode="numeric" autocomplete="off" data-mcode="' + esc(sp.code) + '" aria-label="' + esc(t + ' ' + sp.name) + ' 開機台數" value="' + (n == null ? '' : n) + '"><span class="unit">台</span></label>' +
      '<button type="button" class="step" data-step="1" data-code="' + esc(sp.code) + '" aria-label="加一台">＋</button>' +
      '<button type="button" class="step swap" data-swap="' + esc(sp.code) + '" aria-label="把一台' + esc(sp.name) + '換成別的規格">換</button></div>' +
      '<div class="rowflags" id="mf-' + esc(sp.code) + '"></div>';
  }).join('');
}
function redrawMachineRows() {
  state.types.forEach(function (t, ti) { document.getElementById('mrows' + ti).innerHTML = machineRowsHtml(t); });
  refreshMachine();
}
/* 規格挑選：mode='swap' 把來源規格的 1 台換到選中的規格；mode='add' 選中的規格加 1 台。只列同機型。 */
function openPicker(mode, type, fromCode) {
  var from = fromCode ? specByCode(fromCode) : null;
  var pool = state.data.specs.filter(function (sp) { return sp.type === type && sp.code !== fromCode && (mode === 'swap' || !state.shown[sp.code]); });
  var title = mode === 'swap' ? '把 1 台「' + esc(from.name) + '」換成：' : '加開哪個規格？<span class="hint">（' + esc(type) + '）</span>';
  document.getElementById('pickBody').innerHTML = '<h3>' + title + '</h3>' +
    '<input class="pickq" id="pickq" type="search" placeholder="輸入規格名稱搜尋，例如 812" autocomplete="off" aria-label="搜尋規格">' +
    '<div class="picklist" id="picklist"></div>' +
    '<button type="button" class="applink" id="pickApply">找不到？申報新規格</button>' +
    '<div class="acts"><button class="btn" id="pickCancel" type="button">取消</button></div>';
  function draw(q) {
    q = String(q || '').trim().toLowerCase();
    var hit = pool.filter(function (sp) { return !q || sp.name.toLowerCase().indexOf(q) >= 0; });
    document.getElementById('picklist').innerHTML = hit.length ? hit.map(function (sp) {
      var n = state.counts[sp.code] || 0;
      return '<button type="button" class="pickitem" data-pick="' + esc(sp.code) + '"><span class="bn">' + esc(sp.name) + '</span><span class="sub">' +
        (n ? '目前 ' + n + ' 台・' : '') + '每台每日 ' + fmt(sp.perDay) + ' kg</span></button>';
    }).join('') : '<div class="mempty">找不到符合的規格</div>';
  }
  draw('');
  var dlg = document.getElementById('pick'); dlg.showModal();
  document.getElementById('pickq').addEventListener('input', function (e) { draw(e.target.value); });
  document.getElementById('pickCancel').onclick = function () { dlg.close(); };
  // 申報要離開本頁：這次改的台數還沒送出，先問一聲
  document.getElementById('pickApply').onclick = function () {
    var dirty = state.data.specs.some(function (sp) { return state.counts[sp.code] !== sp.count; });
    if (dirty && !confirm('這次改的台數還沒送出，離開會不見。確定先去申報嗎？')) return;
    gotoForm('apply', { kind: 'spec', type: type, name: document.getElementById('pickq').value.trim() });
  };
  document.getElementById('picklist').onclick = function (e) {
    var b = e.target.closest('[data-pick]'); if (!b) return;
    var to = b.dataset.pick;
    if (mode === 'swap') state.counts[fromCode] = Math.max(0, (state.counts[fromCode] || 0) - 1);
    state.counts[to] = (state.counts[to] || 0) + 1;
    state.shown[to] = true;
    dlg.close(); redrawMachineRows();
  };
}

function renderMachine() {
  var d = state.data;
  state.counts = {}; state.types = []; state.shown = {};
  d.specs.forEach(function (sp) {
    state.counts[sp.code] = sp.count; if (sp.count > 0) state.shown[sp.code] = true;
    if (state.types.indexOf(sp.type) < 0) state.types.push(sp.type);
  });
  document.getElementById('meta').textContent = d.name + (d.lastTime ? '・上次更新 ' + md(d.lastTime) + (d.lastBy ? '（' + d.lastBy + '）' : '') : '・首次填寫');
  var html = dateBar('eff', '這次變動從哪一天開始？<span class="hint">（夜班換規格可選昨天）</span>');
  html += '<p class="hint" style="margin:10px 2px">只列出開機中的規格。換規格按「換」，多開一種規格按「＋加開其他規格」。</p>';
  state.types.forEach(function (t, ti) {
    html += '<details class="cat" open><summary><span class="cname">' + esc(t) + '</span><span class="csum" id="mt' + ti + '"></span></summary><div class="cbody"><div class="grp">' +
      '<div id="mrows' + ti + '"></div><button type="button" class="addbtn" data-add="' + esc(t) + '">＋ 加開其他規格</button></div></div></details>';
  });
  html += '<div class="extra"><span class="lbl">預估每日用料 <span class="hint">（依目前台數即時試算）</span></span><table class="tbl" id="usage"></table></div>';
  app.innerHTML = html;
  state.types.forEach(function (t, ti) { document.getElementById('mrows' + ti).innerHTML = machineRowsHtml(t); });
  app.addEventListener('click', function (e) {
    var a = e.target.closest('[data-add]'); if (a) return openPicker('add', a.dataset.add);
    var s = e.target.closest('[data-swap]'); if (s) return openPicker('swap', specByCode(s.dataset.swap).type, s.dataset.swap);
    var b = e.target.closest('[data-step]'); if (!b) return;
    var code = b.dataset.code, n = Math.max(0, (state.counts[code] || 0) + Number(b.dataset.step));
    state.counts[code] = n; app.querySelector('input[data-mcode="' + code + '"]').value = n; refreshMachine();
  });
  app.addEventListener('input', function (e) {
    var t = e.target; if (!t.matches('input[data-mcode]')) return;
    state.counts[t.dataset.mcode] = /^\d{1,3}$/.test(t.value.trim()) ? Number(t.value.trim()) : null; // 空白或非整數＝未填
    refreshMachine();
  });
  mountBar('<div class="prog" id="prog"></div><button class="btn primary" id="submit" type="button">送出</button>');
  document.getElementById('submit').onclick = openMachineConfirm;
  wireDate('eff', refreshMachine);
  // 從「沒有變動」按鈕進來：直接跳出確認
  if (param('nochange') === '1') openMachineConfirm(true);
}
function refreshMachine() {
  var d = state.data, all = 0, bad = false;
  state.types.forEach(function (t, ti) { var n = typeTotal(t); all += n; document.getElementById('mt' + ti).innerHTML = '開機 <b>' + n + '</b> 台'; });
  d.specs.forEach(function (sp) {
    var n = state.counts[sp.code];
    if (n == null) bad = true;
    var row = document.getElementById('sp-' + sp.code); if (!row) return; // 沒顯示的規格＝維持原台數（0）
    row.classList.toggle('edited', n != null && n !== sp.count);
    row.querySelector('[data-swap]').disabled = !n;
    document.getElementById('mf-' + sp.code).innerHTML = n == null ? '<span class="flag low">請填 0 以上的整數</span>'
      : n !== sp.count ? '<span class="flag big">原本 ' + sp.count + ' 台 → ' + n + ' 台</span>' : '';
  });
  document.getElementById('usage').innerHTML = usageRows(computeUsage());
  document.getElementById('prog').innerHTML = '開機合計 <b>' + all + '</b> 台';
  document.getElementById('submit').disabled = bad || !validDate(document.getElementById('eff').value) || state.busy;
}
function openMachineConfirm(quick) {
  var d = state.data, eff = document.getElementById('eff').value;
  var changed = d.specs.filter(function (sp) { return state.counts[sp.code] !== sp.count; });
  var h = '<h3>' + (quick === true ? '確認今天機台沒有變動？' : '確認送出？') + '</h3><div>生效日 <b>' + eff + '</b>' + (eff !== d.today ? '（不是今天）' : '') + '</div>';
  h += changed.length ? '<div class="sec">有變動的規格</div><ul>' + changed.map(function (sp) {
    return '<li>' + esc(sp.type + ' ' + sp.name) + '：' + sp.count + ' → <b>' + state.counts[sp.code] + '</b> 台</li>'; }).join('') + '</ul>'
    : '<div>台數和目前一樣，送出代表「確認狀況不變」。</div>';
  h += '<div class="sec">開機台數</div><table class="tbl">' + state.types.map(function (t) { return '<tr><td>' + esc(t) + '</td><td class="n">' + typeTotal(t) + ' 台</td></tr>'; }).join('') + '</table>';
  h += '<div class="sec">預估每日用料</div><table class="tbl">' + usageRows(computeUsage()) + '</table>';
  showDialog(h, function () {
    state.busy = true; refreshMachine();
    var btn = document.getElementById('submit'); btn.textContent = '送出中…';
    call('submitMachine', { submitId: state.submitId, effDate: eff, counts: d.specs.map(function (sp) { return { code: sp.code, count: state.counts[sp.code] }; }) })
      .then(function (res) {
        var h2 = '<p>' + (res.changed ? '已記錄變更' : '已確認無變動') + '・批號 ' + esc(res.batchId) + '</p>';
        if (res.days && res.days.length) h2 += '<div style="text-align:left;max-width:420px;margin:0 auto 16px"><table class="tbl"><tr class="c"><td>品項</td><td class="n">每日用料</td><td class="n">可用天數</td></tr>' +
          res.days.map(function (x) { return '<tr class="g' + (x.short ? ' lowt' : '') + '"><td>' + esc(x.group) + (x.short ? ' ⚠' : '') + '</td><td class="n">' + fmt(x.perDay) +
            '</td><td class="n">' + (x.counted ? '約 ' + Math.floor(x.days) + ' 天' : '未盤點') + '</td></tr>'; }).join('') + '</table></div>';
        renderDoneShell(res.changed ? '已更新，謝謝！' : '已確認，謝謝！', h2);
      })
      .catch(function (e) { failSubmit(e, btn, refreshMachine); });
  });
}

/* ================================================================
   四、申報新規格／新廠牌（送出後只進「申報紀錄」，管理者核准才生效）
   ================================================================ */
function gkey(g) { return g.category + '|' + g.group; }
function groupByKey(k) { return state.data.groups.filter(function (g) { return gkey(g) === k; })[0]; }
/* 原料下拉：依類別分組（optgroup），選項只顯示品項名稱，手機上不會被截斷 */
function groupOptions(sel) {
  var html = '<option value="">選原料</option>', cat = null;
  state.data.groups.forEach(function (g) {
    if (g.category !== cat) { if (cat !== null) html += '</optgroup>'; cat = g.category; html += '<optgroup label="' + esc(cat) + '">'; }
    html += '<option value="' + esc(gkey(g)) + '"' + (gkey(g) === sel ? ' selected' : '') + '>' + esc(g.group) + '</option>';
  });
  return html + (cat !== null ? '</optgroup>' : '');
}
function normBrand(s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); }

function renderApply() {
  var d = state.data;
  var kind = param('kind') === 'brand' ? 'brand' : 'spec', type = param('type');
  state.ap = { kind: kind, type: d.types.indexOf(type) >= 0 ? type : '', name: (param('name') || '').slice(0, 30), perDay: '',
               recipe: [{ key: '', ratio: '' }], gkey: '', brand: '' };
  state.note = '';
  document.getElementById('meta').textContent = d.name + '・送出後由管理者審核，核准後會用 LINE 通知你';
  var html = '<div class="extra" style="margin:0 0 12px"><span class="lbl">要申報什麼？</span><div class="datebar">' +
    '<button type="button" class="chip" data-kind="spec">新的紗規格</button><button type="button" class="chip" data-kind="brand">原料多一家廠牌</button></div></div>';
  html += '<div id="apSpec">' +
    '<div class="extra"><span class="lbl">哪一種機台？</span><div class="datebar">' + d.types.map(function (t) {
      return '<button type="button" class="chip" data-type="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div></div>' +
    '<div class="extra"><label for="aname">規格名稱</label><input class="pickq" id="aname" maxlength="30" autocomplete="off" placeholder="例如 860小" value="' + esc(state.ap.name) + '"><div class="apwarn" id="adup"></div></div>' +
    '<div class="extra"><label for="aper">每台每日用料 <span class="hint">（不知道可以空白，管理者會補）</span></label>' +
      '<div><label class="qty" style="width:100%;max-width:none"><input id="aper" inputmode="decimal" autocomplete="off" placeholder="例如 2700"><span class="unit">kg</span></label></div></div>' +
    '<div class="extra"><span class="lbl">配方 <span class="hint" id="areuse">（每種原料占幾 %，加起來要 100）</span></span><div id="arecipe"></div>' +
      '<button type="button" class="addbtn" id="aaddr" style="border-top:0">＋ 再加一種原料</button><div class="apsum" id="asum"></div></div>' +
    '</div>';
  html += '<div id="apBrand">' +
    '<div class="extra"><label for="agroup">哪一種原料？</label><select class="pickq" id="agroup">' + groupOptions('') + '</select><div class="hint" id="abrands"></div></div>' +
    '<div class="extra"><label for="abrand">新廠牌與型號</label><input class="pickq" id="abrand" maxlength="40" autocomplete="off" placeholder="例如 台化 S1003"><div class="apwarn" id="abdup"></div></div>' +
    '</div>';
  html += '<div class="extra"><label for="note">備註 <span class="hint">（選填，例如哪個客戶要的、什麼時候開機）</span></label><textarea id="note" maxlength="500"></textarea></div>';
  if (d.mine && d.mine.length) html += '<div class="extra"><span class="lbl">我最近的申報</span><ul class="mine" style="margin:0;padding-left:20px">' + d.mine.map(function (m) {
    var cls = m.status === '已核准' ? ' ok' : m.status === '已退回' ? ' no' : '';
    return '<li>' + esc(m.title) + '<span class="st' + cls + '">' + esc(m.status) + '</span>' + (m.reason ? '<div class="hint">' + esc(m.reason) + '</div>' : '') + '</li>';
  }).join('') + '</ul></div>';
  app.innerHTML = html;
  drawRecipe();
  app.addEventListener('click', function (e) {
    var k = e.target.closest('[data-kind]'); if (k) { state.ap.kind = k.dataset.kind; return refreshApply(); }
    var t = e.target.closest('[data-type]'); if (t) { state.ap.type = t.dataset.type; return refreshApply(); }
    var del = e.target.closest('[data-rdel]');
    if (del) { state.ap.recipe.splice(Number(del.dataset.rdel), 1); if (!state.ap.recipe.length) state.ap.recipe.push({ key: '', ratio: '' }); drawRecipe(); return refreshApply(); }
    if (e.target.id === 'aaddr') { state.ap.recipe.push({ key: '', ratio: '' }); drawRecipe(); refreshApply(); }
  });
  app.addEventListener('input', function (e) {
    var t = e.target, ap = state.ap;
    if (t.id === 'aname') ap.name = t.value;
    else if (t.id === 'aper') ap.perDay = t.value;
    else if (t.id === 'abrand') ap.brand = t.value;
    else if (t.id === 'note') state.note = t.value;
    else if (t.matches('[data-rr]')) ap.recipe[Number(t.dataset.rr)].ratio = t.value;
    refreshApply();
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('[data-ri]')) state.ap.recipe[Number(t.dataset.ri)].key = t.value;
    else if (t.id === 'agroup') state.ap.gkey = t.value;
    refreshApply();
  });
  mountBar('<div class="prog" id="prog"></div><button class="btn primary" id="submit" type="button">送出</button>');
  document.getElementById('submit').onclick = openApplyConfirm;
  refreshApply();
}
function drawRecipe() {
  document.getElementById('arecipe').innerHTML = state.ap.recipe.map(function (r, i) {
    return '<div class="row rrow"><select data-ri="' + i + '" aria-label="第 ' + (i + 1) + ' 種原料">' + groupOptions(r.key) + '</select>' +
      '<label class="qty"><input data-rr="' + i + '" inputmode="decimal" autocomplete="off" aria-label="第 ' + (i + 1) + ' 種原料比例" value="' + esc(r.ratio) + '"><span class="unit">%</span></label>' +
      '<button type="button" class="step" data-rdel="' + i + '" aria-label="刪掉這一種原料">×</button></div>';
  }).join('');
}
/* 檢查目前填的內容；回傳 { ok, msg（底部列顯示）, ... }。規則與後端 validateSpecApply_／validateBrandApply_ 相同 */
function checkApply() {
  var d = state.data, ap = state.ap;
  if (ap.kind === 'brand') {
    var g = groupByKey(ap.gkey), brand = ap.brand.trim();
    var dup = g && brand && g.brands.some(function (b) { return normBrand(b) === normBrand(brand); });
    return { ok: !!g && !!brand && !dup, dup: dup, group: g, msg: !g ? '請選原料' : !brand ? '請填新廠牌' : dup ? '這家廠牌已經有了' : '可以送出' };
  }

function sGrp(sp) { return sp.group || sp.type; } // 紗盤點照刀距分組（後端已排序）；舊資料沒有 group 時用機型
function sTypes() {
  var types = [];
  state.data.specs.forEach(function (sp) { if (types.indexOf(sGrp(sp)) < 0) types.push(sGrp(sp)); });
  return types;
}
function renderYarnStock() {
  var d = state.data;
  state.s = {};
  d.specs.forEach(function (sp) { state.s[sp.code] = sp.last == null ? '' : String(sp.last); });
  document.getElementById('meta').textContent = d.name + (d.lastTime ? '・上次 ' + md(d.lastTime) + ' ' + d.lastBy : '・第一次盤點');
  var html = dateBar('sdate', '盤點日');
  html += '<p class="hint" style="margin:0 0 10px">' + (d.lastTime ? '棧板數已帶上次的值，<b>只改有變的</b>；' : '') + '每個規格都要填，沒有庫存填 0；不滿一板可填 0.5。</p>';
  var nSpot = d.specs.filter(function (sp) { return sp.spot; }).length;
  if (nSpot) html += '<div class="yspot" style="margin:0 0 10px">🔍 <b>今天抽查 ' + nSpot + ' 個規格</b>：標 🔍 的沒有帶上次的值，請到倉庫實際點數。</div>';
  sTypes().forEach(function (type, ti) {
    var list = d.specs.filter(function (sp) { return sGrp(sp) === type; });
    html += '<details class="cat"' + (ti === 0 ? ' open' : '') + '><summary><span class="cname">' + esc(type) + '</span><span class="csum" id="ss' + ti + '"></span></summary><div class="cbody">';
    list.forEach(function (sp) {
      html += '<div class="row"><div class="lab"><div class="bn">' + (sp.spot ? '🔍 ' : '') + esc(sp.name) + '</div><div class="sub" id="ssub-' + esc(sp.code) + '"></div></div>' +
        '<label class="qty"><input inputmode="decimal" autocomplete="off" aria-label="' + esc(sp.name) + ' 棧板數" data-scode="' + esc(sp.code) + '" value="' + esc(state.s[sp.code]) + '" placeholder="輸入"><span class="unit">板</span></label></div>';
    });
    html += '</div></details>';
  });
  html += '<p style="margin:10px 0"><button type="button" class="applink" id="sZero">還沒填的都填 0</button>' + (nSpot ? ' <span class="hint">（🔍 抽查的不會自動填）</span>' : '') + '</p>';
  html += '<div class="extra"><label for="snote">備註 <span class="hint">（選填）</span></label><textarea id="snote" maxlength="200"></textarea></div>';
  html += '<p class="hint">' + (d.notify.length ? '送出後會通知：' + esc(d.notify.join('、')) + '（及管理者）' : '送出後會通知管理者') + '</p>';
  app.innerHTML = html;
  accordion(app);
  app.addEventListener('input', function (e) {
    if (e.target.matches('input[data-scode]')) { state.s[e.target.dataset.scode] = e.target.value; refreshYarnStock(); }
  });
  document.getElementById('sZero').onclick = function () {
    d.specs.forEach(function (sp) { if (!sp.spot && String(state.s[sp.code]).trim() === '') { state.s[sp.code] = '0'; app.querySelector('input[data-scode="' + sp.code + '"]').value = '0'; } });
    refreshYarnStock();
  };
  mountBar('<div class="prog" id="prog"></div><button class="btn primary" id="submit" type="button">送出</button>');
  document.getElementById('submit').onclick = openYarnStockConfirm;
  wireDate('sdate', refreshYarnStock);
}
function refreshYarnStock() {
  var d = state.data, bad = 0, empty = 0, changed = 0;
  sTypes().forEach(function (type, ti) {
    var sum = 0, sbad = 0;
    d.specs.filter(function (sp) { return sGrp(sp) === type; }).forEach(function (sp) {
      var n = sParse(state.s[sp.code]), msg = sBad(n), el = document.getElementById('ssub-' + sp.code);
      if (msg) { if (n === null) empty++; else { bad++; sbad++; } }
      else { sum = addQty(sum, n); if (!sp.spot && sp.last !== n) changed++; }
      el.innerHTML = msg && n !== null ? '<span style="color:var(--low)">' + msg + '</span>'
        : sp.spot ? '<span style="color:var(--accent)">抽查：請實際點數</span>' : sp.last == null ? '' : (!msg && sp.last !== n ? '<span style="color:var(--warn)">上次 ' + fmt(sp.last) + '</span>' : '上次 ' + fmt(sp.last));
    });
    document.getElementById('ss' + ti).textContent = '合計 ' + fmt(sum) + ' 板' + (sbad ? '・' + sbad + ' 格要修' : '');
  });
  var dv = document.getElementById('sdate').value;
  document.getElementById('prog').innerHTML = state.busy ? '送出中…' : !validDate(dv) ? '盤點日要在 ' + md(d.minDate) + '～今天'
    : bad ? '還有 <b>' + bad + '</b> 格要修' : empty ? '還有 <b>' + empty + '</b> 個規格沒填' : '可以送出（改了 ' + changed + ' 項）';
  document.getElementById('submit').disabled = state.busy || bad > 0 || empty > 0 || !validDate(dv);
}
function openYarnStockConfirm() {
  var d = state.data, total = 0, rows = [];
  sTypes().forEach(function (type) {
    var sum = 0;
    d.specs.filter(function (sp) { return sGrp(sp) === type; }).forEach(function (sp) { sum = addQty(sum, sParse(state.s[sp.code])); });
    total = addQty(total, sum); rows.push('<tr><td>' + esc(type) + '</td><td class="n">' + fmt(sum) + ' 板</td></tr>');
  });
  var changed = d.specs.filter(function (sp) { return d.lastTime && !sp.spot && sp.last !== sParse(state.s[sp.code]); });
  var h = '<h3>確認送出？</h3><div>盤點日 ' + esc(document.getElementById('sdate').value) + '・共 <b>' + fmt(total) + '</b> 板</div><table class="tbl">' + rows.join('') + '</table>';
  if (changed.length) h += '<div class="sec">和上次不同（' + changed.length + ' 項）</div><ul>' + changed.slice(0, 15).map(function (sp) {
    return '<li>' + esc(sp.name + '（' + sGrp(sp) + '）') + '：' + fmt(sp.last == null ? 0 : sp.last) + ' → <b>' + fmt(sParse(state.s[sp.code])) + '</b></li>'; }).join('') + (changed.length > 15 ? '<li>…另 ' + (changed.length - 15) + ' 項</li>' : '') + '</ul>';
  h += '<div class="hint">' + (d.notify.length ? '送出後通知：' + esc(d.notify.join('、')) + '（及管理者）' : '送出後通知管理者') + '</div>';
  showDialog(h, submitYarnStock);
}
function submitYarnStock() {
  var btn = document.getElementById('submit');
  state.busy = true; btn.textContent = '送出中…'; refreshYarnStock();
  var entries = state.data.specs.map(function (sp) { return { code: sp.code, pallets: sParse(state.s[sp.code]) }; });
  call('submitYarnStock', { submitId: state.submitId, date: document.getElementById('sdate').value, entries: entries, note: document.getElementById('snote').value })
    .then(function (res) {
      renderDoneShell('已送出，謝謝！', '<p>共 ' + res.rows + ' 個規格・合計 ' + fmt(res.total) + ' 板</p><p>' + (res.notified ? '已通知主管 ' + res.notified + ' 位及管理者。' : '已通知管理者。') + '</p>');
    })
    .catch(function (e) { failSubmit(e, btn, refreshYarnStock); });
}

/* ================================================================
   七、查詢頁（?form=view）：用看的取代推播，開頁面不耗 LINE 額度；內容依角色由後端決定
   ================================================================ */
var FORM_NAMES = { stock: '庫存盤點', receive: '進貨登錄', machine: '機台開機', yarn: '抽紗紀錄', yarnstock: '庫存紗盤點', denier: '丹尼回報', apply: '申報新規格' };
function renderView() {
  var d = state.data, html = '';
  document.getElementById('meta').textContent = d.name + '・' + d.today + ' 查詢';
  html += '<div class="vlinks">' + d.forms.concat(['apply']).map(function (f) {
    return '<button type="button" class="chip" data-goto="' + f + '">' + FORM_NAMES[f] + '</button>'; }).join('') + '</div>';
  if (d.days) html += viewDays(d.days);
  if (d.yarnToday) html += viewYarnToday(d.yarnToday);
  if (d.denier) html += viewDenier(d.denier);
  if (d.yarnStock) html += viewYarnStock(d.yarnStock);
  if (!d.days && !d.yarnToday && !d.yarnStock && !d.denier) html += '<p class="hint">您的角色沒有可查詢的資料。</p>';
  app.innerHTML = html;
  app.querySelectorAll('[data-goto]').forEach(function (b) { b.onclick = function () { gotoForm(b.dataset.goto); }; });
}
function viewDays(v) {
  if (v.error) return '<details class="cat vsec" open><summary><span class="cname">原料可用天數</span></summary><div class="cbody"><p style="color:var(--low)">算不出來：' + esc(v.error) + '</p></div></details>';
  var short = v.list.filter(function (x) { return x.short; }).length;
  var h = '<details class="cat vsec" open><summary><span class="cname">原料可用天數</span><span class="csum">' +
    (short ? '<b style="color:var(--low)">要叫料 ' + short + ' 項</b>' : '沒有要叫料') + '</span></summary><div class="cbody">';
  if (v.problems.length) h += '<p style="color:var(--low)">設定有誤：' + esc(v.problems.slice(0, 3).join('；')) + '</p>';
  h += '<table class="tbl">' + v.list.map(function (x) {
    var right = !x.counted ? '尚未盤點' : '約 ' + x.days + ' 天（' + esc(x.runout) + '）';
    return '<tr><td' + (x.short ? ' class="lowt"' : '') + '>' + (x.short ? '🔴 ' : '') + esc(x.group) +
      '<div class="hint">理論 ' + fmt(x.theo) + ' ' + esc(x.unit) + (x.lead ? '・前置 ' + x.lead + ' 天' : '') + (x.reserve ? '・留倉 ' + fmt(x.reserve) : '') + '</div></td>' +
      '<td class="n' + (x.short ? ' lowt' : '') + '">' + right + '</td></tr>';
  }).join('') + '</table>';
  h += '<p class="hint">機台最後更新：' + (v.machineTime ? esc(md(v.machineTime)) : '尚無') + '</p></div></details>';
  return h;
}
function viewYarnToday(v) {
  var miss = v.hosts.filter(function (h) { return !h.done; }).length;
  var h = '<details class="cat vsec" open><summary><span class="cname">抽紗今天</span><span class="csum">' +
    (!v.workday ? '今天不用填' : miss ? '<b style="color:var(--warn)">還沒填 ' + miss + ' 台</b>' : '全部填了 ✔') + '</span></summary><div class="cbody"><table class="tbl">';
  h += v.hosts.map(function (x) {
    return '<tr><td>' + esc(x.plant + ' ' + x.host) + '</td><td class="n">' +
      (x.done ? '✔ ' + esc(x.time) + ' ' + esc(x.by) + (x.status === '停機' ? '（停機）' : '') : '<span style="color:var(--warn)">還沒填</span>') + '</td></tr>';
  }).join('');
  return h + '</table></div></details>';
}
function viewYarnStock(v) {
  var types = [];
  v.items.forEach(function (x) { if (types.indexOf(x.group || x.type) < 0) types.push(x.group || x.type); });
  var total = v.items.reduce(function (a, x) { return x.pallets ? addQty(a, x.pallets) : a; }, 0);
  var h = '<details class="cat vsec"><summary><span class="cname">庫存紗（棧板）</span><span class="csum">' +
    (v.time ? '共 ' + fmt(total) + ' 板' : '還沒盤過') + '</span></summary><div class="cbody">';
  if (v.time) h += '<p class="hint">最後盤點：' + esc(md(v.time)) + ' ' + esc(v.by) + '</p>';
  h += '<table class="tbl">' + types.map(function (t) {
    var list = v.items.filter(function (x) { return (x.group || x.type) === t; });
    var sum = list.reduce(function (a, x) { return x.pallets ? addQty(a, x.pallets) : a; }, 0);
    return '<tr class="c"><td>' + esc(t) + '</td><td class="n">' + fmt(sum) + ' 板</td></tr>' + list.filter(function (x) { return x.pallets; }).map(function (x) {
      return '<tr class="g"><td>' + esc(x.name) + '</td><td class="n">' + fmt(x.pallets) + ' 板</td></tr>'; }).join('');
  }).join('') + '</table><p class="hint">只列有庫存的規格。</p></div></details>';
  return h;
}

function viewDenier(v) {
  var miss = 0;
  v.slots.forEach(function (sl) { sl.plants.forEach(function (x) { if (!x.done && !(sl.date === v.current.date && sl.shift === v.current.shift)) miss++; }); });
  var h = '<details class="cat vsec" open><summary><span class="cname">丹尼照片</span><span class="csum">' +
    (miss ? '<b style="color:var(--warn)">漏拍 ' + miss + ' 班</b>' : '沒有漏拍') + '</span></summary><div class="cbody"><table class="tbl">';
  v.slots.slice().reverse().forEach(function (sl) {
    var now = sl.date === v.current.date && sl.shift === v.current.shift;
    h += '<tr class="c"><td>' + esc(sl.date.slice(5).replace('-', '/') + ' ' + sl.shift) + (now ? '（這班）' : '') + '</td><td class="n"></td></tr>';
    h += sl.plants.map(function (x) {
      return '<tr class="g"><td>' + esc(x.plant) + '</td><td class="n">' + (x.done
        ? '<a href="' + esc(x.link) + '" target="_blank" rel="noopener">看照片</a> ' + esc(x.by) + (x.count > 1 ? '（' + x.count + ' 張）' : '')
        : '<span style="color:var(--warn)">' + (now ? '還沒拍' : '漏拍') + '</span>') + '</td></tr>';
    }).join('');
  });
  return h + '</table></div></details>';
}

/* ================================================================
   八、丹尼回報（?form=denier）：每廠每班拍白板丹尼區一張；照片留檔不辨識，存雲端硬碟格式化命名
   ================================================================ */
function renderDenier() {
  var d = state.data;
  state.dn = { plant: null, shift: d.shift, photo: null };
  var firstTodo = d.plants.filter(function (pl) { return !d.done[d.shiftDate + '|' + d.shift + '|' + pl]; })[0];
  state.dn.plant = firstTodo || d.plants[0];
  document.getElementById('meta').textContent = d.name + '・每廠每班拍一張白板丹尼區';
  var html = '<div class="extra" style="margin:0 0 12px"><span class="lbl">廠別</span><div class="ytabs">' + d.plants.map(function (pl) {
    return '<button type="button" class="chip" data-dplant="' + esc(pl) + '">' + esc(pl) + '</button>'; }).join('') + '</div></div>';
  html += '<div class="extra" style="margin:0 0 12px"><span class="lbl">班別</span><div class="ytabs">' + d.shifts.map(function (sh) {
    return '<button type="button" class="chip" data-dshift="' + esc(sh) + '">' + esc(sh) + '</button>'; }).join('') + '</div>' +
    '<p class="hint" style="margin:6px 0 0">系統已依時間先選好；晚班在隔天早上拍，日期記上班那天。</p></div>';
  html += '<div class="extra" style="margin:0 0 12px"><label for="ddate" class="lbl">日期（上班那天）</label>' +
    '<div class="datebar"><input type="date" id="ddate" value="' + d.shiftDate + '" min="' + d.minDate + '" max="' + d.today + '"></div></div>';
  html += '<div class="extra"><span class="lbl">白板丹尼區照片</span><label class="photo-btn" style="margin-top:6px">📷 拍丹尼區<input type="file" accept="image/*" capture="environment" id="dphoto" hidden></label>' +
    '<div class="photo-prev" id="dprev"></div><p class="hint">四個黑角都要入鏡、正對板子；只拍丹尼區，不要拍到人。</p></div>';
  html += '<p class="hint" id="dstat"></p>';
  app.innerHTML = html;
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.dplant) { state.dn.plant = b.dataset.dplant; refreshDenier(); }
    if (b.dataset.dshift) { state.dn.shift = b.dataset.dshift; refreshDenier(); }
  });
  document.getElementById('ddate').addEventListener('input', refreshDenier);
  document.getElementById('dphoto').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    shrinkPhoto(f, function (data) { state.dn.photo = data; document.getElementById('dprev').innerHTML = '<img alt="已拍照片" src="' + data + '">'; refreshDenier(); });
  });
  mountBar('<div class="prog" id="prog"></div><button class="btn primary" id="submit" type="button">送出</button>');
  document.getElementById('submit').onclick = function () {
    var dn = state.dn, day = document.getElementById('ddate').value;
    showDialog('<h3>確認送出？</h3><div>' + esc(dn.plant) + '廠・' + esc(day) + ' ' + esc(dn.shift) + '</div>' +
      (state.data.done[day + '|' + dn.shift + '|' + dn.plant] ? '<div class="hint">這班已經拍過，會再多存一張（舊的保留）。</div>' : ''), submitDenier);
  };
  refreshDenier();
}
function refreshDenier() {
  var d = state.data, dn = state.dn, day = document.getElementById('ddate').value;
  app.querySelectorAll('[data-dplant]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.dplant === dn.plant)); });
  app.querySelectorAll('[data-dshift]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.dshift === dn.shift)); });
  var done = d.done[day + '|' + dn.shift + '|' + dn.plant];
  document.getElementById('dstat').innerHTML = done ? '這班已由 ' + esc(done.by) + ' 在 ' + esc(done.time) + ' 拍過' + (done.count > 1 ? '（共 ' + done.count + ' 張）' : '') + '，再送會多存一張。' : '這班還沒拍。';
  var ok = validDate(day) && !!dn.photo;
  document.getElementById('prog').innerHTML = state.busy ? '送出中…' : !validDate(day) ? '日期要在 ' + md(d.minDate) + '～今天' : !dn.photo ? '還沒拍照' : '<b>' + esc(dn.plant) + ' ' + esc(dn.shift) + '</b> 可以送出';
  document.getElementById('submit').disabled = state.busy || !ok;
}
function submitDenier() {
  var btn = document.getElementById('submit'), dn = state.dn;
  state.busy = true; btn.textContent = '送出中…'; refreshDenier();
  call('submitDenier', { submitId: state.submitId, plant: dn.plant, shift: dn.shift, date: document.getElementById('ddate').value, photo: dn.photo })
    .then(function (res) {
      var other = state.data.plants.filter(function (pl) { return pl !== dn.plant; })[0];
      renderDoneShell('已存檔，謝謝！', '<p>' + esc(res.fileName) + '</p>' + (other ? '<p><button class="btn" type="button" onclick="gotoForm(\'denier\')">接著拍 ' + esc(other) + '廠</button></p>' : ''));
    })
    .catch(function (e) { failSubmit(e, btn, refreshDenier); });
}
