<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>庫存盤點</title>
<style>
  /* ===== 色彩與字級 token（亮色／暗色）===== */
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1d211c; --muted: #6b7068; --line: #dfe2dc;
    --accent: #06a74f; --accent-ink: #ffffff; --accent-soft: #e3f5ea;
    --warn: #b35c00; --warn-soft: #fff1df; --low: #c62828; --low-soft: #fdeaea;
    --radius: 14px;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141613; --card: #1e211d; --ink: #eceee9; --muted: #9ba097; --line: #31352f;
      --accent: #2bc66d; --accent-ink: #0b1a10; --accent-soft: #183224;
      --warn: #f0a24a; --warn-soft: #34260f; --low: #ff7b72; --low-soft: #3a1c1b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }

  header { padding: 18px 16px 10px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  header .meta { margin-top: 4px; color: var(--muted); font-size: 14px; }
  main { padding: 0 16px 120px; max-width: 560px; margin: 0 auto; }
  .hint { color: var(--muted); font-size: 14px; font-weight: 400; }

  /* 大類收合區塊 */
  details.cat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
  details.cat > summary { list-style: none; cursor: pointer; padding: 14px 14px; display: flex; gap: 10px; align-items: center; }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary::after { content: '▾'; color: var(--muted); margin-left: 4px; transition: transform .15s; }
  details.cat[open] > summary::after { transform: rotate(180deg); }
  details.cat[open] > summary { border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; background: var(--card); border-radius: var(--radius) var(--radius) 0 0; }
  .cname { font-weight: 700; font-size: 18px; }
  .badge { font-size: 13px; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .badge.due { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .badge.opt { background: var(--bg); color: var(--muted); }
  .csum { margin-left: auto; text-align: right; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .csum b { color: var(--ink); font-size: 15px; }
  .cbody { padding: 10px 10px 4px; }
  .optin { display: flex; align-items: center; gap: 10px; padding: 10px 6px 12px; font-weight: 600; }
  .optin input { width: 22px; height: 22px; accent-color: var(--accent); }
  .cbody.off .grp { opacity: .45; }

  .grp { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: var(--card); }
  .grp-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 9px 12px;
              background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
  .grp-head .gname { font-weight: 700; }
  .grp-head .gsub { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; font-size: 15px; }
  .grp-flag:empty { display: none; }
  .grp-flag { padding: 0 12px 8px; background: color-mix(in srgb, var(--accent) 7%, var(--card)); }

  .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
  .row .lab { flex: 1; min-width: 0; }
  .row .lab .bn { font-weight: 600; }
  .row .lab .sub { font-size: 13px; color: var(--muted); }
  .row .lab .sub.chg { color: var(--warn); font-weight: 600; }
  .row.edited { box-shadow: inset 4px 0 0 var(--warn); }
  .qty { width: 46%; max-width: 190px; display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px;
         background: var(--bg); padding: 0 10px; min-height: 46px; }
  .qty:focus-within { border-color: var(--accent); }
  .qty input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; font-size: 19px; text-align: right;
               font-variant-numeric: tabular-nums; outline: none; padding: 8px 0; }
  .qty .unit { color: var(--muted); font-size: 14px; margin-left: 6px; }
  .qty input:disabled { color: var(--muted); }
  .rowflags { padding: 0 12px 8px; margin-top: -4px; }
  .rowflags:empty { display: none; }
  details.zero > summary { list-style: none; cursor: pointer; padding: 9px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  details.zero > summary::-webkit-details-marker { display: none; }
  .flag { margin: 2px 4px 2px 0; font-size: 13px; border-radius: 8px; padding: 3px 8px; display: inline-block; }
  .flag.low { color: var(--low); background: var(--low-soft); }
  .flag.big { color: var(--warn); background: var(--warn-soft); }

  .extra { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-top: 12px; }
  .extra > label, .extra .lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  .extra textarea { width: 100%; min-height: 72px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px 10px; resize: vertical; }
  .extra .photo-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--bg); }
  .photo-prev { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .photo-prev img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  .link { background: none; border: 0; color: var(--low); padding: 6px; text-decoration: underline; }

  /* 日期列（機台生效日、到貨日） */
  .datebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .datebar input[type=date] { min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 10px; font-size: 17px; }
  .chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* 機台列 */
  .mrow .qty { width: auto; flex: 1; max-width: none; }
  .mrow .qty input { text-align: center; }
  .step { min-width: 52px; min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); font-size: 22px; font-weight: 700; }
  .mrow { flex-wrap: wrap; }
  .mrow .lab { flex-basis: 100%; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card);
         border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .bar .prog { font-size: 14px; color: var(--muted); flex: 1; }
  .bar .prog b { color: var(--ink); font-size: 17px; }
  .btn { min-height: 48px; border-radius: 12px; padding: 0 18px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; }

  .center { text-align: center; padding: 48px 16px; }
  .center .big { font-size: 48px; }
  .center p { color: var(--muted); }
  .err { color: var(--low); white-space: pre-line; }

  dialog { border: 0; border-radius: 18px; padding: 0; width: min(92vw, 480px); max-height: 88vh; overflow-y: auto; background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 18px 16px 14px; }
  .dlg h3 { margin: 0 0 8px; font-size: 19px; }
  .dlg ul { margin: 6px 0 10px; padding-left: 20px; }
  .dlg .sec { font-size: 15px; font-weight: 600; margin-top: 12px; }
  .dlg .acts { display: flex; gap: 10px; margin-top: 14px; }
  .dlg .acts .btn { flex: 1; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
  .tbl td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .tbl td.n { text-align: right; white-space: nowrap; padding-left: 8px; }
  .tbl tr.c td { font-weight: 700; padding-top: 8px; }
  .tbl tr.g td:first-child { padding-left: 12px; }
  .tbl .lowt { color: var(--low); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; margin: 0 auto 12px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } details.cat > summary::after { transition: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">庫存盤點</h1>
  <div class="meta" id="meta">載入中…</div>
</header>
<main id="app"><div class="center"><div class="spin"></div><p>載入中…</p></div></main>
<dialog id="confirm"><div class="dlg" id="confirmBody"></div></dialog>

<script>
/* ===== 部署設定：換成實際值（皆非機密，可公開）===== */
var CONFIG = {
  LIFF_ID: 'xxxxxxxxxx-xxxxxxxx',                                 // LINE Developers → LIFF 分頁的 LIFF ID
  GAS_URL: 'https://script.google.com/macros/s/XXXXXXXX/exec',    // Apps Script 部署後的網頁應用程式網址
  FORCE_DEMO: false                                                // true＝不連 LINE／後端，只看畫面
};

/* 網址參數：LIFF 會先把參數放在 liff.state，初始化後才還原，兩處都看 */
function param(name) {
  var q = location.search, m = /[?&]liff\.state=([^&]*)/.exec(q);
  var all = q + (m ? '&' + decodeURIComponent(m[1]).replace(/^\?/, '') : '');
  var r = new RegExp('[?&]' + name + '=([^&]*)').exec(all);
  return r ? decodeURIComponent(r[1]) : null;
}
var DEMO = CONFIG.FORCE_DEMO || param('demo') === '1';
var FORM = param('form') === 'machine' ? 'machine' : param('form') === 'receive' ? 'receive' : 'stock';
var TITLES = { stock: '庫存盤點', receive: '進貨登錄', machine: '機台開機狀況' };
document.title = TITLES[FORM];
document.getElementById('title').textContent = TITLES[FORM];

var state = { data: null, qty: {}, note: '', photo: null, submitId: null, busy: false, optIn: {} };
var app = document.getElementById('app');
var DRAFT_KEY = 'stock-draft-v2';

/* ---------- 工具 ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return (n == null || n === '') ? '—' : Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 }); }
function newId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
/* 輸入字串 → 數字；空白或非數字回傳 null（不做捨入，原樣送出） */
function parseQty(s) {
  s = String(s == null ? '' : s).replace(/,/g, '').trim();
  if (s === '' || !/^\d+(\.\d+)?$/.test(s)) return null;
  return Number(s);
}
function dec(n) { var s = String(n); return s.indexOf('.') < 0 ? 0 : s.length - s.indexOf('.') - 1; }
/* 加總、相乘時避免浮點尾差（0.1+0.2），不做捨入；與後端 addQty_／mulQty_ 同規則 */
function addQty(a, b) { var f = Math.pow(10, Math.max(dec(a), dec(b))); return (Math.round(a * f) + Math.round(b * f)) / f; }
function mulQty(a, b) { var da = dec(a), db = dec(b); return (Math.round(a * Math.pow(10, da)) * Math.round(b * Math.pow(10, db))) / Math.pow(10, da + db); }
function md(s) { return s ? s.slice(5, 16).replace('-', '/') : ''; }
function addDays(key, n) { var d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function byCode(code) { return state.data.items.filter(function (x) { return x.code === code; })[0]; }
function catOf(name) { return (state.data.categories || []).filter(function (c) { return c.category === name; })[0]; }
function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ qty: state.qty, optIn: state.optIn, note: state.note, submitId: state.submitId, t: Date.now() })); } catch (e) {} }
function loadDraft() { try { var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (d && Date.now() - d.t < 12 * 3600 * 1000) return d; } catch (e) {} return null; }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

/* ---------- 後端呼叫 ---------- */
function call(action, extra) {
  if (DEMO) return demoCall(action, extra || {});
  var body = Object.assign({ action: action, idToken: liff.getIDToken() }, extra || {});
  // Content-Type 用 text/plain，避免瀏覽器先送預檢請求（Apps Script 不處理 OPTIONS）
  return fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
    .then(function (r) { if (!r.ok) throw new Error('伺服器回應 ' + r.status); return r.json(); })
    .then(function (res) {
      if (res.ok) return res;
      if (res.code === 'AUTH') { if (FORM === 'stock') saveDraft(); liff.login({ redirectUri: location.href }); }
      var e = new Error(res.message || '發生錯誤'); e.code = res.code; throw e;
    });
}

/* ---------- 啟動 ---------- */
function start() {
  var p = DEMO ? Promise.resolve() : liff.init({ liffId: CONFIG.LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(function () {}); }
  });
  p.then(function () { return call('init', { form: FORM }); })
   .then(function (res) {
     if (res.status === 'pending') return renderPending(res);
     state.data = res; state.submitId = newId();
     if (FORM === 'machine') return renderMachine();
     if (FORM === 'receive') return renderReceive();
     renderStock();
   })
   .catch(function (e) { renderError(e.message || String(e)); });
}
function renderPending(res) {
  document.getElementById('meta').textContent = res.name || '';
  app.innerHTML = '<div class="center"><div class="big">🕒</div><h2>已送出開通申請</h2><p>' + esc(res.name) +
    '，管理者開通後就能使用。<br>請告知管理者您已完成申請。</p></div>';
}
function renderError(msg) {
  app.innerHTML = '<div class="center"><div class="big">⚠️</div><h2>無法載入</h2><p class="err">' + esc(msg) +
    '</p><button class="btn" onclick="location.reload()">重新載入</button></div>';
}
function mountBar(html) {
  var bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<div class="in">' + html + '</div>';
  document.body.appendChild(bar);
}
function showDialog(html, onGo) {
  document.getElementById('confirmBody').innerHTML = html +
    '<div class="acts"><button class="btn" id="back" type="button">返回修改</button><button class="btn primary" id="go" type="button">確認送出</button></div>';
  var dlg = document.getElementById('confirm'); dlg.showModal();
  document.getElementById('back').onclick = function () { dlg.close(); };
  document.getElementById('go').onclick = function () { dlg.close(); onGo(); };
}
function renderDoneShell(title, inner) {
  var bar = document.querySelector('.bar'); if (bar) bar.remove();
  app.innerHTML = '<div class="center"><div class="big">✅</div><h2>' + title + '</h2>' + inner +
    '<button class="btn primary" id="closeBtn" type="button">關閉</button></div>';
  window.scrollTo(0, 0);
  document.getElementById('closeBtn').onclick = function () { if (!DEMO && liff.isInClient()) liff.closeWindow(); else location.reload(); };
}
function failSubmit(e, btn, refresh) {
  state.busy = false; btn.textContent = '送出'; refresh();
  if (e.code !== 'AUTH') alert('送出失敗：' + (e.message || e) + '\n\n填好的內容都還在，可以直接再按一次送出。');
}
/* 一次只展開一個大類 */
function accordion(root) {
  root.querySelectorAll('details.cat').forEach(function (d) {
    d.addEventListener('toggle', function () {
      if (d.open) root.querySelectorAll('details.cat[open]').forEach(function (o) { if (o !== d) o.open = false; });
    });
  });
}
/* 依「大類 → 品項」分組（保留後端排序） */
function grouped(items) {
  var cats = [], ci = {};
  items.forEach(function (it) {
    if (!(it.category in ci)) { ci[it.category] = cats.length; cats.push({ category: it.category, groups: [], gi: {} }); }
    var c = cats[ci[it.category]];
    if (!(it.group in c.gi)) { c.gi[it.group] = c.groups.length; c.groups.push({ group: it.group, unit: it.unit, items: [] }); }
    c.groups[c.gi[it.group]].items.push(it);
  });
  return cats;
}

/* ================================================================
   一、庫存盤點
   ================================================================ */
/* 這個大類這次有沒有盤：到期的一定盤；沒到期的要勾選「這次也盤」 */
function isCounted(cat) { var c = catOf(cat); return (c && c.due) || !!state.optIn[cat]; }
function countedItems() { return state.data.items.filter(function (it) { return isCounted(it.category); }); }
function isLow(it, q) { return q != null && it.safety > 0 && q < it.safety; }
function isBig(it, q) { return q != null && it.lastQty != null && it.lastQty > 0 && Math.abs(q - it.lastQty) / it.lastQty > state.data.bigChangeRatio; }

/* 小計與總計（與後端 computeTotals_ 同規則；只算有盤的大類） */
function computeTotals(items) {
  var cats = [], ci = {}, lowBrands = [];
  items.forEach(function (it) {
    var q = state.qty[it.code], has = q != null;
    if (!(it.category in ci)) { ci[it.category] = cats.length; cats.push({ category: it.category, unit: it.unit, total: 0, complete: true, groups: [], _g: {} }); }
    var c = cats[ci[it.category]];
    if (!(it.group in c._g)) { c._g[it.group] = c.groups.length; c.groups.push({ group: it.group, unit: it.unit, subtotal: 0, safety: it.groupSafety || 0, low: false, complete: true, unchanged: true }); }
    var g = c.groups[c._g[it.group]];
    g.subtotal = addQty(g.subtotal, has ? q : 0); c.total = addQty(c.total, has ? q : 0);
    if (!has) { g.complete = false; c.complete = false; }
    if (q !== it.lastQty) g.unchanged = false;
    if (c.unit !== it.unit) c.unit = '';
    if (isLow(it, q)) lowBrands.push({ name: it.name, qty: q, unit: it.unit, safety: it.safety });
  });
  var lowGroups = [];
  cats.forEach(function (c) { delete c._g; c.groups.forEach(function (g) {
    g.low = g.complete && g.safety > 0 && g.subtotal < g.safety;
    if (g.low) lowGroups.push({ name: g.group, qty: g.subtotal, unit: g.unit, safety: g.safety });
  }); });
  return { categories: cats, lowGroups: lowGroups, lowBrands: lowBrands };
}

function renderStock() {
  var d = state.data, draft = loadDraft();
  state.qty = {}; state.optIn = {};
  d.items.forEach(function (it) { if (it.lastQty != null) state.qty[it.code] = it.lastQty; }); // 預填上次數量
  if (draft) {
    state.optIn = draft.optIn || {}; state.note = draft.note || ''; state.submitId = draft.submitId || state.submitId;
    d.items.forEach(function (it) { if (draft.qty && it.code in draft.qty) state.qty[it.code] = draft.qty[it.code]; });
  }
  var dueNames = d.categories.filter(function (c) { return c.due; }).map(function (c) { return c.category; });
  document.getElementById('meta').textContent = d.warehouse + '・' + d.name + '・本次要盤：' + (dueNames.join('、') || '無（可自選）');
  var html = '<p class="hint" style="margin:0 0 10px">數量已預填上次盤點值，<b>只改有變動的</b>；沒有變動的不用動。</p>';
  // 到期的大類排前面
  var cats = grouped(d.items).sort(function (a, b) { return (catOf(b.category).due ? 1 : 0) - (catOf(a.category).due ? 1 : 0); });
  var firstDue = true;
  cats.forEach(function (c, ci) {
    var st = catOf(c.category);
    html += '<details class="cat" data-cat="' + esc(c.category) + '"' + (st.due && firstDue ? ' open' : '') + '><summary>' +
      '<span class="cname">' + esc(c.category) + '</span>' +
      (st.due ? '<span class="badge due">本次要盤</span>' : '<span class="badge opt">可選' + (st.lastTime ? '・上次 ' + md(st.lastTime).slice(0, 5) : '') + '</span>') +
      '<span class="csum" id="cs' + ci + '"></span></summary><div class="cbody" id="cb' + ci + '">';
    if (st.due) firstDue = false;
    else html += '<label class="optin"><input type="checkbox" data-optin="' + esc(c.category) + '"' + (state.optIn[c.category] ? ' checked' : '') + '>這次也盤這一類（每 ' + st.cycle + ' 天盤一次）</label>';
    c.groups.forEach(function (g, gi) {
      var gid = ci + '-' + gi;
      html += '<div class="grp"><div class="grp-head"><span class="gname">' + esc(g.group) + '</span><span class="gsub" id="gs' + gid + '"></span></div><div class="grp-flag" id="gf' + gid + '"></div>';
      var zero = g.items.filter(function (it) { return it.lastQty === 0; });
      g.items.filter(function (it) { return it.lastQty !== 0; }).forEach(function (it) { html += stockRow(it); });
      if (zero.length) html += '<details class="zero"><summary>上次為 0 的廠牌（' + zero.length + '）▾</summary>' + zero.map(stockRow).join('') + '</details>';
      html += '</div>';
    });
    html += '</div></details>';
    c.ci = ci;
  });
  state.cats = cats;
  html += '<div class="extra"><span class="lbl">照片 <span class="hint">（選填，異常時拍一張）</span></span>' +
    '<label class="photo-btn">📷 拍照／選照片<input type="file" accept="image/*" id="photo" hidden></label><div class="photo-prev" id="photoPrev"></div></div>' +
    '<div class="extra"><label for="note">備註 <span class="hint">（選填）</span></label><textarea id="note" maxlength="500" placeholder="例如：HDPE 廠牌C 有兩包受潮"></textarea></div>';
  app.innerHTML = html;
  document.getElementById('note').value = state.note;
  accordion(app);

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('input[data-code]')) {
      var q = parseQty(t.value);
      if (q == null) delete state.qty[t.dataset.code]; else state.qty[t.dataset.code] = q;
      refreshStock(); saveDraft();
    } else if (t.id === 'note') { state.note = t.value; saveDraft(); }
  });
  app.addEventListener('change', function (e) {
    if (e.target.matches('input[data-optin]')) { state.optIn[e.target.dataset.optin] = e.target.checked; refreshStock(); saveDraft(); }
  });
  app.addEventListener('click', function (e) {
    if (e.target.id === 'rmPhoto') { state.photo = null; document.getElementById('photoPrev').innerHTML = ''; document.getElementById('photo').value = ''; }
  });
  document.getElementById('photo').addEventListener('change', onPhoto);
  mountBar('<div class="prog" id="prog"></div><button class="btn primary" id="submit" type="button">送出</button>');
  document.getElementById('submit').onclick = openStockConfirm;
  refreshStock();
}

function stockRow(it) {
  var v = state.qty[it.code];
  return '<div class="row" id="r-' + esc(it.code) + '"><div class="lab"><div class="bn">' + esc(it.brand || it.group) + '</div>' +
    '<div class="sub" id="sub-' + esc(it.code) + '"></div></div>' +
    '<label class="qty"><input inputmode="decimal" autocomplete="off" aria-label="' + esc(it.name) + ' 數量" data-code="' + esc(it.code) + '"' +
    ' value="' + (v == null ? '' : v) + '" placeholder="輸入"><span class="unit">' + esc(it.unit) + '</span></label></div>' +
    '<div class="rowflags" id="rf-' + esc(it.code) + '"></div>';
}

/* 依目前輸入更新：每列的變動提示、品項小計、大類總計與進度、送出鈕 */
function refreshStock() {
  var d = state.data, needFill = 0, edited = 0, countedCats = 0;
  d.items.forEach(function (it) {
    var on = isCounted(it.category), q = state.qty[it.code];
    var inp = app.querySelector('input[data-code="' + it.code + '"]'); inp.disabled = !on;
    var changed = q !== it.lastQty;
    document.getElementById('r-' + it.code).classList.toggle('edited', on && changed && q != null);
    var sub = document.getElementById('sub-' + it.code);
    sub.className = 'sub' + (changed && q != null && it.lastQty != null ? ' chg' : '');
    sub.textContent = it.lastQty == null ? '新廠牌，請填數量' : changed && q != null
      ? '上次 ' + fmt(it.lastQty) + ' → ' + (q - it.lastQty > 0 ? '+' : '') + fmt(addQty(q, -it.lastQty)) : '上次 ' + fmt(it.lastQty);
    var f = '';
    if (on && isLow(it, q)) f += '<span class="flag low">此廠牌低於安全庫存 ' + fmt(it.safety) + '</span>';
    if (on && isBig(it, q)) f += '<span class="flag big">和上次差很多，請確認</span>';
    document.getElementById('rf-' + it.code).innerHTML = f;
    if (on) { if (q == null) needFill++; if (changed && q != null) edited++; }
  });
  var t = computeTotals(d.items);
  t.categories.forEach(function (c) {
    var meta = state.cats.filter(function (x) { return x.category === c.category; })[0], ci = meta.ci, on = isCounted(c.category);
    var catEdited = d.items.filter(function (it) { return it.category === c.category && state.qty[it.code] !== it.lastQty && state.qty[it.code] != null; }).length;
    if (on) countedCats++;
    document.getElementById('cb' + ci).classList.toggle('off', !on);
    document.getElementById('cs' + ci).innerHTML = on
      ? '總計 <b>' + fmt(c.total) + '</b> ' + esc(c.unit) + '<br>' + (c.complete ? '改了 ' + catEdited + ' 項' : '<span style="color:var(--low)">有未填</span>')
      : '這次不盤';
    c.groups.forEach(function (g, gi) {
      var gid = ci + '-' + gi;
      document.getElementById('gs' + gid).textContent = '小計 ' + fmt(g.subtotal) + ' ' + g.unit + (g.complete ? '' : '（未填完）');
      document.getElementById('gf' + gid).innerHTML = on && g.low ? '<span class="flag low">品項小計低於安全庫存 ' + fmt(g.safety) + '</span>' : '';
    });
  });
  document.getElementById('prog').innerHTML = '本次盤 <b>' + countedCats + '</b> 類・改了 <b>' + edited + '</b> 項' + (needFill ? '・<span style="color:var(--low)">未填 ' + needFill + '</span>' : '');
  document.getElementById('submit').disabled = needFill > 0 || countedCats === 0 || state.busy;
}

/* 照片：縮到長邊 1280px、JPEG 品質 0.75，降低上傳量 */
function onPhoto(e) {
  var file = e.target.files && e.target.files[0]; if (!file) return;
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function () {
    var s = Math.min(1, 1280 / Math.max(img.width, img.height));
    var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    state.photo = c.toDataURL('image/jpeg', 0.75); URL.revokeObjectURL(url);
    document.getElementById('photoPrev').innerHTML = '<img alt="已選照片" src="' + state.photo + '"><button class="link" id="rmPhoto" type="button">移除</button>';
  };
  img.onerror = function () { alert('這張照片讀不到，請換一張'); };
  img.src = url;
}

function totalsTable(t) {
  return '<table class="tbl">' + t.categories.map(function (c) {
    return '<tr class="c"><td>' + esc(c.category) + ' 總計</td><td class="n">' + fmt(c.total) + ' ' + esc(c.unit) + '</td></tr>' +
      c.groups.map(function (g) { return '<tr class="g' + (g.low ? ' lowt' : '') + '"><td>' + esc(g.group) + (g.low ? ' ⚠' : '') + '</td><td class="n">' + fmt(g.subtotal) + '</td></tr>'; }).join('');
  }).join('') + '</table>';
}
function lowList(t) {
  var li = function (x, tag) { return '<li>' + tag + esc(x.name) + '：<b>' + fmt(x.qty) + '</b> ' + esc(x.unit) + '（安全 ' + fmt(x.safety) + '）</li>'; };
  return t.lowGroups.map(function (x) { return li(x, '[品項小計] '); }).join('') + t.lowBrands.map(function (x) { return li(x, '[廠牌] '); }).join('');
}

/*
 * 送出前確認。「沒改數字但系統估計應該有變」：品項的廠牌全部維持上次數字，
 * 而理論庫存和上次盤點差了 2% 以上（且至少 1）時提醒，防止沒點就送出。
 */
function openStockConfirm() {
  var items = countedItems(), t = computeTotals(items), big = [], lazy = [];
  items.forEach(function (it) { if (isBig(it, state.qty[it.code])) big.push(it); });
  t.categories.forEach(function (c) { c.groups.forEach(function (g) {
    var L = state.data.ledger[c.category + '|' + g.group];
    if (g.unchanged && L && L.base > 0 && Math.abs(L.theo - L.base) >= Math.max(1, L.base * 0.02)) lazy.push({ g: g, L: L });
  }); });
  var edited = items.filter(function (it) { return state.qty[it.code] !== it.lastQty; }).length;
  var h = '<h3>確認送出？</h3><div>本次盤 ' + t.categories.map(function (c) { return esc(c.category); }).join('、') + '，共 ' + items.length + ' 項：改了 <b>' + edited + '</b> 項</div>';
  if (lazy.length) h += '<div class="sec" style="color:var(--warn)">數字都沒改，但系統估計應該有變動</div><ul>' + lazy.map(function (x) {
    return '<li>' + esc(x.g.group) + '：維持 ' + fmt(x.L.base) + '，系統估計約 <b>' + fmt(Math.max(0, x.L.theo)) + '</b>（' + (x.L.theo < x.L.base ? '應已用掉約 ' + fmt(x.L.base - x.L.theo) : '期間有進貨') + '）</li>'; }).join('') + '</ul><div class="hint">確定有實際點過再送出。</div>';
  if (big.length) h += '<div class="sec" style="color:var(--warn)">和上次差很多（請再看一眼）</div><ul>' + big.map(function (it) {
    return '<li>' + esc(it.name) + '：<b>' + fmt(state.qty[it.code]) + '</b>（上次 ' + fmt(it.lastQty) + '）</li>'; }).join('') + '</ul>';
  if (t.lowGroups.length || t.lowBrands.length) h += '<div class="sec" style="color:var(--low)">低於安全庫存（會通知管理者）</div><ul>' + lowList(t) + '</ul>';
  h += '<div class="sec">本次總計與小計</div>' + totalsTable(t);
  showDialog(h, submitStock);
}

function submitStock() {
  state.busy = true; refreshStock();
  var btn = document.getElementById('submit'); btn.textContent = '送出中…';
  var entries = countedItems().map(function (it) { return { code: it.code, qty: state.qty[it.code] }; });
  call('submit', { submitId: state.submitId, entries: entries, note: state.note, photo: state.photo })
    .then(function (res) {
      clearDraft();
      var h = '<p>共 ' + res.count + ' 項・批號 ' + esc(res.batchId) + '</p>';
      if (res.lowCount) h += '<p style="color:var(--low)">低於安全庫存 ' + res.lowCount + ' 項，已通知管理者。</p>';
      if (res.variance && res.variance.length) h += '<div style="text-align:left;max-width:420px;margin:0 auto 8px"><div class="sec" style="font-weight:600">盤點差異（實盤－理論）</div><table class="tbl">' +
        res.variance.map(function (v) { var bad = v.ratio !== null && Math.abs(v.ratio) > 0.05;
          return '<tr class="g' + (bad ? ' lowt' : '') + '"><td>' + esc(v.group) + (bad ? ' ⚠' : '') + '</td><td class="n">' + (v.diff > 0 ? '+' : '') + fmt(v.diff) +
            (v.ratio === null ? '' : '（' + (v.ratio > 0 ? '+' : '') + fmt(v.ratio * 100) + '%）') + '</td></tr>'; }).join('') + '</table></div>';
      h += '<div style="text-align:left;max-width:420px;margin:0 auto 16px">' + totalsTable(res.totals) + '</div>';
      renderDoneShell('已送出，謝謝！', h);
    })
    .catch(function (e) { failSubmit(e, btn, refreshStock); });
}

/* ================================================================
   二、進貨登錄
   ================================================================ */
function dateBar(id, label) {
  var d = state.data;
  return '<div class="extra" style="margin:0 0 12px"><span class="lbl">' + label + '</span><div class="datebar">' +
    '<input type="date" id="' + id + '" value="' + d.today + '" min="' + d.minDate + '" max="' + d.today + '">' +
    '<button type="button" class="chip" data-day="0">今天</button><button type="button" class="chip" data-day="-1">昨天</button></div></div>';
}
/* 日期快捷鈕：今天／昨天，並同步按鈕狀態 */
function wireDate(id, onChange) {
  var inp = document.getElementById(id), d = state.data;
  var sync = function () {
    app.querySelectorAll('[data-day]').forEach(function (b) { b.setAttribute('aria-pressed', String(inp.value === addDays(d.today, Number(b.dataset.day)))); });
    onChange();
  };
  app.querySelectorAll('[data-day]').forEach(function (b) { b.onclick = function () { inp.value = addDays(d.today, Number(b.dataset.day)); sync(); }; });
  inp.addEventListener('change', sync); sync();
}
function validDate(v) { var d = state.data; return /^\d{4}-\d{2}-\d{2}$/.test(v) && v >= d.minDate && v <= d.today; }

function renderReceive() {
  var d = state.data;
  state.qty = {};
  document.getElementById('meta').textContent = d.warehouse + '・' + d.name + '・收貨當下登錄，只填有到貨的品項';
  var html = dateBar('rdate', '到貨日');
  grouped(d.items).forEach(function (c, ci) {
    html += '<details class="cat"' + (ci === 0 ? ' open' : '') + '><summary><span class="cname">' + esc(c.category) + '</span><span class="csum" id="rs' + ci + '"></span></summary><div class="cbody">';
    c.groups.forEach(function (g) {
      html += '<div class="grp"><div class="grp-head"><span class="gname">' + esc(g.group) + '</span></div>' + g.items.map(function (it) {
        return '<div class="row"><div class="lab"><div class="bn">' + esc(it.brand || it.group) + '</div></div><label class="qty"><input inputmode="decimal" autocomplete="off" aria-label="' + esc(it.name) +
          ' 到貨數量" data-rcode="' + esc(it.code) + '" placeholder="到貨"><span class="unit">' + esc(it.unit) + '</span></label></div>';
      }).join('') + '</div>';
    });
    html += '</div></details>';
    c.items = c.groups.reduce(function (a, g) { return a.concat(g.items); }, []);
  });
  state.rcats = grouped(d.items);
  html += '<div class="extra"><label for="note">備註 <span class="hint">（選填，例如供應商、單號）</span></label><textarea id="note" maxlength="500"></textarea></div>';
  app.innerHTML = html;
  accordion(app);
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('input[data-rcode]')) { var q = parseQty(t.value); if (q == null || q === 0) delete state.qty[t.dataset.rcode]; else state.qty[t.dataset.rcode] = q; refreshReceive(); }
    else if (t.id === 'note') state.note = t.value;
  });
  mountBar('<div class="prog" id="prog"></div><button class="btn primary" id="submit" type="button">送出</button>');
  document.getElementById('submit').onclick = openReceiveConfirm;
  wireDate('rdate', refreshReceive);
}
function refreshReceive() {
  var codes = Object.keys(state.qty), total = codes.reduce(function (a, c) { return addQty(a, state.qty[c]); }, 0);
  state.rcats.forEach(function (c, ci) {
    var n = 0; c.groups.forEach(function (g) { g.items.forEach(function (it) { if (state.qty[it.code]) n++; }); });
    document.getElementById('rs' + ci).innerHTML = n ? '已填 <b>' + n + '</b> 項' : '';
  });
  document.getElementById('prog').innerHTML = '已填 <b>' + codes.length + '</b> 項・合計 <b>' + fmt(total) + '</b> kg';
  document.getElementById('submit').disabled = !codes.length || !validDate(document.getElementById('rdate').value) || state.busy;
}
function openReceiveConfirm() {
  var date = document.getElementById('rdate').value;
  var list = state.data.items.filter(function (it) { return state.qty[it.code]; });
  showDialog('<h3>確認送出進貨？</h3><div>到貨日 <b>' + date + '</b>，共 ' + list.length + ' 項</div><table class="tbl">' +
    list.map(function (it) { return '<tr><td>' + esc(it.name) + '</td><td class="n">' + fmt(state.qty[it.code]) + ' ' + esc(it.unit) + '</td></tr>'; }).join('') + '</table>', function () {
    state.busy = true; refreshReceive();
    var btn = document.getElementById('submit'); btn.textContent = '送出中…';
    call('submitReceive', { submitId: state.submitId, date: date, note: state.note, entries: list.map(function (it) { return { code: it.code, qty: state.qty[it.code] }; }) })
      .then(function (res) { renderDoneShell('進貨已登錄', '<p>' + res.count + ' 項・合計 ' + fmt(res.total) + ' kg・批號 ' + esc(res.batchId) + '</p>'); })
      .catch(function (e) { failSubmit(e, btn, refreshReceive); });
  });
}

/* ================================================================
   三、機台開機
   ================================================================ */
/* 每日用料試算：Σ（台數 × 每台每日用料 × 比例%），與後端 rateOn_ 同規則 */
function computeUsage() {
  var d = state.data, by = {}, order = [];
  d.specs.forEach(function (sp) {
    var n = state.counts[sp.code] || 0; if (!n) return;
    (d.recipes[sp.name] || []).forEach(function (x) {
      var k = x.category + '|' + x.group;
      if (!(k in by)) { by[k] = 0; order.push(x); }
      by[k] = addQty(by[k], mulQty(mulQty(n, sp.perDay), x.ratio) / 100);
    });
  });
  return order.map(function (x) { return { category: x.category, group: x.group, perDay: by[x.category + '|' + x.group] }; });
}
function typeTotal(type) { return state.data.specs.filter(function (sp) { return sp.type === type; }).reduce(function (a, sp) { return a + (state.counts[sp.code] || 0); }, 0); }
function usageRows(u) { return u.length ? u.map(function (x) { return '<tr><td>' + esc(x.group) + '</td><td class="n">' + fmt(x.perDay) + ' kg</td></tr>'; }).join('') : '<tr><td>目前沒有開機中的規格</td><td></td></tr>'; }

function renderMachine() {
  var d = state.data;
  state.counts = {}; state.types = [];
  d.specs.forEach(function (sp) { state.counts[sp.code] = sp.count; if (state.types.indexOf(sp.type) < 0) state.types.push(sp.type); });
  document.getElementById('meta').textContent = d.name + (d.lastTime ? '・上次更新 ' + md(d.lastTime) + (d.lastBy ? '（' + d.lastBy + '）' : '') : '・首次填寫');
  var html = dateBar('eff', '這次變動從哪一天開始？<span class="hint">（夜班換規格可選昨天）</span>');
  state.types.forEach(function (t, ti) {
    html += '<details class="cat" open><summary><span class="cname">' + esc(t) + '</span><span class="csum" id="mt' + ti + '"></span></summary><div class="cbody"><div class="grp">';
    d.specs.filter(function (sp) { return sp.type === t; }).forEach(function (sp) {
      html += '<div class="row mrow" id="sp-' + esc(sp.code) + '"><div class="lab"><span class="bn">' + esc(sp.name) + '</span>　<span class="sub" style="display:inline">每台每日 ' + fmt(sp.perDay) + ' kg</span></div>' +
        '<button type="button" class="step" data-step="-1" data-code="' + esc(sp.code) + '" aria-label="減一台">－</button>' +
        '<label class="qty"><input inputmode="numeric" autocomplete="off" data-mcode="' + esc(sp.code) + '" aria-label="' + esc(t + ' ' + sp.name) + ' 開機台數" value="' + sp.count + '"><span class="unit">台</span></label>' +
        '<button type="button" class="step" data-step="1" data-code="' + esc(sp.code) + '" aria-label="加一台">＋</button></div><div class="rowflags" id="mf-' + esc(sp.code) + '"></div>';
    });
    html += '</div></div></details>';
  });
  html += '<div class="extra"><span class="lbl">預估每日用料 <span class="hint">（依目前台數即時試算）</span></span><table class="tbl" id="usage"></table></div>';
  app.innerHTML = html;
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-step]'); if (!b) return;
    var code = b.dataset.code, n = Math.max(0, (state.counts[code] || 0) + Number(b.dataset.step));
    state.counts[code] = n; app.querySelector('input[data-mcode="' + code + '"]').value = n; refreshMachine();
  });
  app.addEventListener('input', function (e) {
    var t = e.target; if (!t.matches('input[data-mcode]')) return;
    state.counts[t.dataset.mcode] = /^\d{1,3}$/.test(t.value.trim()) ? Number(t.value.trim()) : null; // 空白或非整數＝未填
    refreshMachine();
  });
  mountBar('<div class="prog" id="prog"></div><button class="btn primary" id="submit" type="button">送出</button>');
  document.getElementById('submit').onclick = openMachineConfirm;
  wireDate('eff', refreshMachine);
  // 從「沒有變動」按鈕進來：直接跳出確認
  if (param('nochange') === '1') openMachineConfirm(true);
}
function refreshMachine() {
  var d = state.data, all = 0, bad = false;
  state.types.forEach(function (t, ti) { var n = typeTotal(t); all += n; document.getElementById('mt' + ti).innerHTML = '開機 <b>' + n + '</b> 台'; });
  d.specs.forEach(function (sp) {
    var n = state.counts[sp.code];
    if (n == null) bad = true;
    document.getElementById('sp-' + sp.code).classList.toggle('edited', n != null && n !== sp.count);
    document.getElementById('mf-' + sp.code).innerHTML = n == null ? '<span class="flag low">請填 0 以上的整數</span>'
      : n !== sp.count ? '<span class="flag big">原本 ' + sp.count + ' 台 → ' + n + ' 台</span>' : '';
  });
  document.getElementById('usage').innerHTML = usageRows(computeUsage());
  document.getElementById('prog').innerHTML = '開機合計 <b>' + all + '</b> 台';
  document.getElementById('submit').disabled = bad || !validDate(document.getElementById('eff').value) || state.busy;
}
function openMachineConfirm(quick) {
  var d = state.data, eff = document.getElementById('eff').value;
  var changed = d.specs.filter(function (sp) { return state.counts[sp.code] !== sp.count; });
  var h = '<h3>' + (quick === true ? '確認今天機台沒有變動？' : '確認送出？') + '</h3><div>生效日 <b>' + eff + '</b>' + (eff !== d.today ? '（不是今天）' : '') + '</div>';
  h += changed.length ? '<div class="sec">有變動的規格</div><ul>' + changed.map(function (sp) {
    return '<li>' + esc(sp.type + ' ' + sp.name) + '：' + sp.count + ' → <b>' + state.counts[sp.code] + '</b> 台</li>'; }).join('') + '</ul>'
    : '<div>台數和目前一樣，送出代表「確認狀況不變」。</div>';
  h += '<div class="sec">開機台數</div><table class="tbl">' + state.types.map(function (t) { return '<tr><td>' + esc(t) + '</td><td class="n">' + typeTotal(t) + ' 台</td></tr>'; }).join('') + '</table>';
  h += '<div class="sec">預估每日用料</div><table class="tbl">' + usageRows(computeUsage()) + '</table>';
  showDialog(h, function () {
    state.busy = true; refreshMachine();
    var btn = document.getElementById('submit'); btn.textContent = '送出中…';
    call('submitMachine', { submitId: state.submitId, effDate: eff, counts: d.specs.map(function (sp) { return { code: sp.code, count: state.counts[sp.code] }; }) })
      .then(function (res) {
        var h2 = '<p>' + (res.changed ? '已記錄變更' : '已確認無變動') + '・批號 ' + esc(res.batchId) + '</p>';
        if (res.days && res.days.length) h2 += '<div style="text-align:left;max-width:420px;margin:0 auto 16px"><table class="tbl"><tr class="c"><td>品項</td><td class="n">每日用料</td><td class="n">可用天數</td></tr>' +
          res.days.map(function (x) { return '<tr class="g' + (x.short ? ' lowt' : '') + '"><td>' + esc(x.group) + (x.short ? ' ⚠' : '') + '</td><td class="n">' + fmt(x.perDay) +
            '</td><td class="n">' + (x.counted ? '約 ' + Math.floor(x.days) + ' 天' : '未盤點') + '</td></tr>'; }).join('') + '</table></div>';
        renderDoneShell(res.changed ? '已更新，謝謝！' : '已確認，謝謝！', h2);
      })
      .catch(function (e) { failSubmit(e, btn, refreshMachine); });
  });
}
